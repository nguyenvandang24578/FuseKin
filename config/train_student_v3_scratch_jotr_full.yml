# Student v3 SCRATCH, du lieu FULL (2026-10-29): GIONG HET train_student_v3_scratch_jotr.yml (cung co v3_*, lifter cu
# gtmask_d512_e40 latest, khong KD), CHI DOI cach lay du lieu: TRAIN.mix_mode 'full' = moi epoch duyet het 4 bo
# (Human36M + MuCo + MSCOCO + CrowdPose), moi mau 1 lan, thay vi ti le 0.25 x 32000 mau / epoch (co hoan lai).
# Ly do: 22 epoch x 32000 = 0.7M luot mau, PostoMETRO ~15M -> nghi thieu luong train. So voi v3 scratch 75.53 / 48.31 / 90.22.
# LUU Y: ti le bo nay theo KICH THUOC bo (khong con 25% moi bo) va so epoch / lich lr phai chinh theo do dai epoch.
# Chay: python main/train.py --cfg ./config/train_student_v3_scratch_jotr_full.yml --exp_name student_v3_scratch_jotr_full --gpu 0
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw']
  workers: 8
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam_gtmask_d512_e40/latest_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  backbone_pretrained: 'spin'
  student_use_kd: False    # from scratch
  init_student_from_teacher: False
  kd_hard_w: 0.5

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 3       # [D] 0 = tat
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  mix_mode: 'full'          # MOI: moi epoch duyet het 4 bo, moi mau 1 lan (thay ratio 0.25 x 32000 mau)
  begin_epoch: 1
  end_epoch: 12                # TAM: chinh theo so iter / epoch in o dau log (xem dong '# [full] mau / epoch')
  scheduler: 'step'
  lr: 0.0001
  lr_step: [6, 9, 11]          # TAM: cung ti le ~[0.45, 0.73, 0.9] nhu lich v3 scratch
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
