# =====================================================================
# FuseKin -- DiffLifter v3_mix = kien truc v3 + tron dataset theo ti le + dropout
# Ly do (log v3 / v3_bal):
#   - v3     (balance False, 3DPW-train ~4%) : 3dpw test tot nhat 77.7 (ep 3) roi xau dan
#   - v3_bal (balance True,  3DPW lap ~14 lan/epoch): 3dpw test 71.6 o ep 2 (tot hon adaLN cu ~74)
#     nhung overfit tu ep 3 (72.8 -> 77.2 o ep 5)
#   => kien truc v3 tot; can nhieu 3DPW nhung khong lap qua nhanh -> ti le 20% (~4.7 lan/epoch) + dropout 0.1
# Chay:
#   python main/finetune_difflifter.py --cfg config/finetune_difflifter_v3_mix.yaml --gpu 0
# =====================================================================

DATASET:
  lift_only: True
  train_list: ['Human36M', 'MuCo', '3dpw-train']
  test_list: ['3dpw', 'Human36M', '3dpw-oc', '3dpw-pc']
  pw3d_2d_source: 'halpe26'
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True
  workers: 8
  no_rot_aug: False

DIFFLIFT:
  # Model
  embed_dim: 384
  depth: 8
  num_heads: 8
  cond_mode: 'adaln'
  conf_attn: True
  skel_attn: True
  mask_token: True
  self_cond: True
  drop_rate: 0.1
  drop_path_rate: 0.1

  # Diffusion
  timesteps: 1000
  sampling_timesteps: 5
  num_proposals: 5
  scale: 3.0
  aggregate: 'mean'

  # Training
  val_set: '3dpw-val'
  save_dir: 'experiment/finetune_difflifter_v3_mix'
  epochs: 15
  lr: 0.0003
  lr_decay: 0.95
  weight_decay: 0.01
  batch_size: 512
  save_freq: 5
  iters_per_epoch: 0
  print_freq: 50
  balance_datasets: False
  dataset_ratio: [0.4, 0.4, 0.2]   # Human36M, MuCo, 3dpw-train
  samples_per_epoch: 0             # 0 = tong so mau (~535k)
  resume: ''
  ema_decay: 0.999

  # Danh gia them trong luc train (chi log)
  epoch_eval_sets: ['3dpw']
  full_eval_sets: ['Human36M', '3dpw-oc', '3dpw-pc']
  full_eval_freq: 5

  # Occlusion augmentation
  joint_drop_prob: 0.05
  limb_drop_prob: 0.05
  jitter_std: 0.02
  occ_aug_prob: 0.15
  occ_shift_std: 0.15
