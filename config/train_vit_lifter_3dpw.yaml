# =====================================================================
# train_vit_lifter_3dpw (2026-11-18, nguoi dung duyet): VitLifter = ImgLifter KHONG Refiner
#   2D ViTPose (x, y, conf) chi la DIEU KIEN diffusion; anh = ResNet-50 SPIN DONG BANG (f8 cross-attn + feat_j f16)
#   + vector anh toan cuc cong vao moi token (vit_glob_img). Denoiser / Markov / loss xuong-goc giong
#   train_img_lifter_dense48_3dpw_markov (num_ctx 0). CHI train 3dpw-train (thu nghiem, khong so bang chinh).
# 2D: test = 3DPW_{test,oc,pc}_halpe26_vitpose_opbox.json; train = 3DPW_train_halpe26<pw3d_halpe_train_suffix>.json
# Chay:
#   python main/train_vit_lifter.py --cfg config/train_vit_lifter_3dpw.yaml --exp_name vit_lifter_3dpw --gpu 0
#   python main/eval_vit_lifter.py --cfg config/train_vit_lifter_3dpw.yaml \
#     --ckpt experiment/vit_lifter_3dpw/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc --gpu 0
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['3dpw-train']
  workers: 8
  pw3d_2d_source: 'halpe26'
  pw3d_halpe_suffix: '_vitpose_opbox'      # test / oc / pc: bbox OpenPose (ban chinh, experiment.md muc 51)
  pw3d_halpe_train_suffix: '_vitpose'      # train: bbox GT annotation (doi '_vitpose_opbox' neu da trich)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False                    # cot 3 cua joints van giu conf -> log_b
  fusekin_unified: True
  drop_raw_smpl_stats: True

TRAIN:
  print_freq: 20
  batch_size: 64
  shuffle: True
  dataset_ratio: [1.0]
  samples_per_epoch: 32000                 # 500 iter / epoch voi batch 64
  end_epoch: 25
  lr: 0.0002
  lr_step: [18, 23]
  lr_factor: 0.1

TEST:
  batch_size: 64
  shuffle: False

IMGLIFT:
  vit_glob_img: True
  vit_enc_pretrained: 'spin'
  vit_logb_eps: 0.01
  num_ctx: 0
  markov_layer: True
  markov_gate_b: True       # cong theo log_b = -log(conf)
  w_bone: 0.5
  w_angle: 0.1
  embed_dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 2.0
  drop_path: 0.1
  timesteps: 1000
  scale: 3.0
  input_drop_prob: 0.1
  weight_decay: 0.01
  ema_decay: 0.999
  eval_sets: ['3dpw', '3dpw-oc', '3dpw-pc']
  eval_max_samples: 3000
  eval_K: 5
  eval_S: 2
  eta: 1.0
