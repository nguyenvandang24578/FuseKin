# Teacher B: giong HET config/train_teacher.yml (Teacher A), chi khac teacher_lift_clean_prob.
# Muc tieu: van hoc dung anh khi joint nhieu (nhu A), nhung giu do chinh xac khi nhan GT sach
# (A bi tut tu 44.6 -> 58.0 mm o a = 0 vi gan nhu khong thay mau sach luc train).
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  # NHO: dung CUNG duong dan MotionBERT voi Teacher A tren server (ban moi, khong tru root).
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False

  backbone_pretrained: 'spin'

  # (A) input = (1-a)*GT + a*MotionBERT_lift
  teacher_lift_alpha_max: 2.0
  # MOI: 50% mau nhan GT sach (a = 0), 50% con lai a ~ U(0, 2.0)
  teacher_lift_clean_prob: 0.5
  # Giu nhu Teacher A de log val so sanh truc tiep duoc
  teacher_lift_alpha_eval: 1.0

  teacher_joint_corrupt_prob: 0.0
  teacher_joint_corrupt_mode: 'zero'
  teacher_joint_corrupt_noise_std: 0.15
  teacher_joint_corrupt_warmup_epochs: 0

  img_probe: True
  img_probe_w: 0.1

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 15, 25]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
