# =====================================================================
# train_img_lifter_sd_a0 (2026-11-15, nguoi dung duyet, experiment.md muc 44) = SD lifter muc A0.
#   = train_img_lifter_dense48_markov_no3dpw (Refiner day DONG BANG, decoder ImgLifter giu nguyen), CHI doi:
#   - f8 (64 token anh cho cross-attn) lay tu Stable Diffusion 1.5 + ControlNet theo DPMesh (IMGLIFT.sd_enable)
#     thay f8 ResNet-50 cua Refiner; xy / log_b / feat_j / 48 diem day van tu Refiner;
#   - A0: VAE, U-Net, ControlNet (ca conv dau) dong bang; train LoRA r64 + outmodules + kp_lifting + lifter;
#   - lr hang 2e-4 (giong DPMesh main_train.yml: lr_dec_factor 1), 20 epoch (DPMesh);
#   - batch 16 x grad_accum 4 = 64 hieu dung (giong lifter cu), 4000 batch / epoch = 1000 buoc cap nhat.
#   Yeu to gay nhieu khi so voi lifter no3dpw (74.66 / 49.72, K5 S2, 3DPW day du): lifter cu 25 epoch, lr giam x0.1
#   o 18 / 23 -> chenh < ~2 mm khong ket luan duoc.
#   sd_ckpt: SUA lai cho dung duong dan tren server truoc khi chay.
# Chay:
#   python main/train_img_lifter.py --cfg config/train_img_lifter_sd_a0.yaml --exp_name img_lifter_sd_a0 --gpu 0
#   python main/eval_img_lifter.py --cfg config/train_img_lifter_sd_a0.yaml --ckpt experiment/img_lifter_sd_a0/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --K 5 --S 2 --gpu 0
#   (them --ablate_sd: f8 SD = 0, do dong gop rieng cua SD)
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train
  workers: 8
  pw3d_2d_source: 'openpose'
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True
  fusekin_unified: True
  drop_raw_smpl_stats: True

TRAIN:
  print_freq: 20
  batch_size: 16                             # micro-batch (4 / bo); x grad_accum 4 = 64
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]
  samples_per_epoch: 64000                   # giu nhu lifter cu
  end_epoch: 20                              # DPMesh
  lr: 0.0002
  lr_step: [999]                             # lr hang (DPMesh lr_dec_factor 1)
  lr_factor: 1.0

TEST:
  batch_size: 32
  shuffle: False

REFINE2D:
  deconv_ch: 256

IMGLIFT:
  refiner_ckpt: 'experiment/refiner2d_dense48_scratch/checkpoint/last.pth.tar'
  num_ctx: 48
  markov_layer: True
  markov_gate_b: True
  w_bone: 0.5
  w_angle: 0.1
  embed_dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 2.0
  drop_path: 0.1
  timesteps: 1000
  scale: 3.0
  train_xy_noise: 0.5
  input_drop_prob: 0.1                       # = che 10% khop cua DPMesh (det = 0 -> heatmap 0)
  weight_decay: 0.01                         # DPMesh 0.01
  ema_decay: 0.999
  eval_sets: ['3dpw', '3dpw-pc', '3dpw-crowd']
  eval_max_samples: 3000
  eval_K: 5
  eval_S: 2
  eta: 1.0
  jpma_max_b: 3.0
  grad_accum: 4
  # --- SD lifter ---
  sd_enable: True
  sd_ckpt: 'data_final/pretrained/control_sd15_openpose.pth'   # SUA cho dung server
  sd_lora_rank: 64
  sd_train_control: 'none'                   # A0
  sd_ctrl_in_init: 'copy_latent'
  sd_hm_size: 32
  sd_hm_sigma: 2.5
  sd_hm_mask_det: True
  sd_latent_scale: 1.0
  sd_img_pm1: False
  sd_bf16: True
  sd_grad_ckpt: False
  sd_lr_scale: 1.0
  sd_eval_ablate: True                       # moi epoch: them 3dpw (3000 mau) voi f8 SD = 0
