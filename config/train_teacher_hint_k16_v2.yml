# Teacher T-hint TREN KIEN TRUC V2 (PLAN_TEACHER_HINT.md + PLAN_STUDENT_V2.md):
#   anh + joint MotionBERT (GIONG Student) + goi y nen z (16 so) tu [GT 3D, GT 3D - lift]
#   + 5 thay doi kien truc v2 (PE2D, self-attn khop, goc xoay theo khop, neo xuong, shape doc token).
# Train TU DAU (hint_init_from = ''), cung lich 50 epoch voi train_student_v2.yml
#   -> dong [KHONG goi y] so truc tiep duoc voi student_v2 (cung kien truc, cung lich, cung cach chon ckpt).
# Chon checkpoint tren 3dpw-val theo dong [CO goi y]; moi epoch danh gia val + test x (co / khong goi y) = 4 luot.
# Kiem tra truoc: python main/check_student_v2.py --cfg ./config/train_teacher_hint_k16_v2.yml --gpu 0
# Chay:          python main/train.py --cfg ./config/train_teacher_hint_k16_v2.yml --exp_name teacher_hint_k16_v2 --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw-val', '3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 16
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  # PHAI giong config Student v2 -> joint vao Teacher va Student y het nhau
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'

  teacher_lift_alpha_max: 0.0
  teacher_joint_corrupt_prob: 0.0
  img_probe: False            # T-hint dung kien truc Student, khong co head tham do anh

  # ---- Goi y nen (giong train_teacher_hint_k16.yml, TRU hint_off_prob: 0.3 -> 0.2) ----
  teacher_hint: True
  hint_dim: 16
  hint_noise: 0.1
  hint_off_prob: 0.2          # 20% mau z = 0 (k16 cu: 30%)
  hint_init_from: ''          # train tu dau

  # ---- Kien truc v2 (giong train_student_v2.yml) ----
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  scheduler: 'step'
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw-val'
