# Teacher T-hint TREN KIEN TRUC V2 (PLAN_TEACHER_HINT.md + PLAN_STUDENT_V2.md):
#   anh + joint MotionBERT (GIONG Student) + goi y nen z (16 so) tu [GT 3D, GT 3D - lift]
#   + 5 thay doi kien truc v2 (PE2D, self-attn khop, goc xoay theo khop, neo xuong, shape doc token).
# Train TU DAU (hint_init_from = ''), 50 epoch.
# 2026-10-14: chuyen 2D dau vao sang Halpe-26 + MotionBERT finetune Halpe-26 (truoc do: OpenPose).
#   Student (train_student_*.yml) VAN dung OpenPose -> chua khop Teacher nay; sua Student khi can KD.
# Moi epoch: 1 luot val (3dpw-val, dong CO goi y = dong chon best). Train xong: tu nap best.pth.tar, test 1 lan tren 3dpw (co + khong goi y).
# Kiem tra truoc: python main/check_student_v2.py --cfg ./config/train_teacher_hint_k16_v2.yml --gpu 0   (log phai co 'Load Halpe-26 input')
# Chay:          python main/train.py --cfg ./config/train_teacher_hint_k16_v2.yml --exp_name teacher_hint_k16_v2_halpe --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw-val']        # moi epoch CHI danh gia val; test 1 lan cuoi tu dong (TEST.final_test_list)
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 16
  use_gt_input: False
  seqlen: 1
  stride: 1
  # 2D 3DPW = Halpe-26 (RTMPose), du 17 khop. Can 3DPW_{train,validation,test}_halpe26.json trong thu muc PW3D.
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3          # PHAI giong luc finetune MotionBERT

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  # MotionBERT finetune Halpe-26 -> SUA duong dan neu ckpt moi luu o cho khac
  motionbert_pretrained: './experiment/finetune_motionbert_halpe26_full/best_epoch.bin'
  motionbert_2d_rootrel: False
  motionbert_drop_joints: []     # Halpe-26 du 17 khop -> khong xoa khop nao (giong luc finetune)
  backbone_pretrained: 'spin'

  teacher_lift_alpha_max: 0.0
  teacher_joint_corrupt_prob: 0.0
  img_probe: False            # T-hint dung kien truc Student, khong co head tham do anh

  # ---- Goi y nen (giong train_teacher_hint_k16.yml, TRU hint_off_prob: 0.3 -> 0.2) ----
  teacher_hint: True
  hint_dim: 16
  hint_noise: 0.1
  hint_off_prob: 0.2          # 20% mau z = 0 (k16 cu: 30%)
  hint_init_from: ''          # train tu dau

  # ---- Kien truc v2 (giong train_student_v2.yml) ----
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  scheduler: 'step'
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw-val'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
