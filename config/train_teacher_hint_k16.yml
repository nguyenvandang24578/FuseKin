# Teacher T-hint (PLAN_TEACHER_HINT.md): anh + joint MotionBERT (GIONG Student) + goi y nen z (16 so) tu [GT, GT - lift].
# Goi y bi gioi han (k = 16, nhieu 0.1 tren z, tat 30% mau) -> Teacher buoc phai tu fuse anh + joint nhieu.
# Chay: python main/train.py --cfg ./config/train_teacher_hint_k16.yml --exp_name teacher_hint_k16 --gpu 0
# Moi epoch test 2 dong: [co goi y] (chon best theo dong nay) va [KHONG goi y] (= hoan canh Student).
# Tieu chi (xem PLAN muc 5): co goi y <= ~75 mm; goi y giup >= 10 mm; content_ablation mean - that (co goi y) >= 8 mm.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  # PHAI giong config Student (E3) -> joint vao Teacher va Student y het nhau
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'

  teacher_lift_alpha_max: 0.0
  teacher_joint_corrupt_prob: 0.0
  img_probe: False            # T-hint dung kien truc Student, khong co head tham do anh

  # ---- Goi y nen ----
  teacher_hint: True
  hint_dim: 16
  hint_noise: 0.1             # nhieu tren MA NEN z (khong dung GT) -> moi chieu ~2-3 bit
  hint_off_prob: 0.3          # 30% mau z = 0 -> Teacher cung lam tot khi khong co goi y
  # Khoi tao tu Teacher GT (moi phan trung ten; bo ma hoa joint + nhanh goi y khoi tao moi). SUA duong dan neu khac.
  hint_init_from: './experiment/teacher/checkpoint/best.pth.tar'

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [15, 22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
