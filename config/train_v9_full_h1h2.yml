# =====================================================================
# train_v9_full_h1h2.yml (2026-11-17, nguoi dung duyet, PLAN_H1H2.md muc 6, experiment.md muc 53)
#   = train_v9_full_ik_rp.yml (giao thuc du du lieu, last 82.45 / 55.23 / 101.06), CHI them key:
#   E3: H1 + H2.
#   Giu nguyen moi thu khac (du lieu, lr, 20 epoch, lifter no3dpw dong bang). Bao epoch cuoi.
# Chay (1 GPU):
#   python main/train.py --cfg ./config/train_v9_full_h1h2.yml --exp_name v9_full_h1h2 --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_v9_full_h1h2.yml --ckpt experiment/v9_full_h1h2/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --gpu 0
#   (chan doan: them --blend 1 de do mat mat IK khi dua thang lifter vao IK [chi khi khong co cong]; --drop3d)
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (giao thuc JOTR / DPMesh)
  test_list: ['3dpw']          # moi epoch chi 3dpw (chi log); 4 tap test 1 lan o last.pth.tar
  pw3d_ocpc_test_only: False
  workers: 8
  pw3d_2d_source: 'openpose'   # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd); train: GT + PoseFix
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True
  fusekin_unified: True

MODEL:
  name: 'student'              # dung Student_Trainer (khong KD); model that su = V9Net qua v9_e2e
  v9_e2e: True
  v9_dim: 256
  v9_img_enc: 2
  v9_fuse_layers: 3
  v9_smpl_dec: 3
  v9_hgcn: True
  v9_drop3d_sample: 0.2
  v9_drop3d_joint: 0.1
  v9_joint_drop: 0.1
  # ---- [MOI] IK tu khop Student ----
  v9_ik: True
  v9_reproj: True             # [MOI] lay mau lai theo phep chieu
  v9_reproj_w: 1.0
  # ---- [MOI] H1 / H2 (PLAN_H1H2.md muc 6) ----
  v9_ik_grad: True
  v9_ik_res29: True
  v9_res29_body_max: 0.04
  v9_res29_reg_w: 0.01
  v9_j29_all_w: 1.0
  v9_gate: True
  v9_gate_w: 0.1
  v6_m_path: 'data_final/h36m17_to_smpl29.npy'
  v7_bone_gn_iters: 3
  v7_bone_beta_reg: 0.001
  v7_dbeta_w: 0.01
  v7_j29_loss_w: 1.0
  imglift_checkpoint: 'experiment/img_lifter_dense48_markov_no3dpw/checkpoint/last.pth.tar'   # Refiner lay tu ckpt
  imglift_K: 5
  imglift_S: 2
  resnet_type: 50
  hpe_dim: 512                 # khong dung boi V9Net
  backbone_pretrained: 'spin'
  student_use_kd: False
  init_student_from_teacher: False
  v7_anchor: False
  v7_no_pose_param_loss: True  # IK quyet dinh goc -> bo loss tham so pose
  v7_no_privileged: True       # privileged_3d = ctx_3d -> tat de khong tinh 2 lan
  v5_ctx_loss_w: 1.0           # loss khop 3D phu tu 17 token khop da fuse
  v3_bb_finetune: True         # backbone train end-to-end
  v3_bb_lr_scale: 0.1          # lr backbone = 1e-5
  v3_bb_heatmap: True
  v3_heatmap_sigma: 2.0
  v3_refine_gamma: 0.85        # trong so giam sat cac lop decoder truoc (refine_history)
  v3_pose2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 64               # 1 GPU
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 64000     # 1000 iter / epoch (nguoi dung duyet 22:26)
  begin_epoch: 1
  end_epoch: 20
  scheduler: 'step'
  lr: 0.0001
  lr_step: [8, 12, 15, 18]     # giam 4 lan (nguoi dung 10:45)
  lr_factor: 0.5               # 1e-4 -> 5e-5 -> 2.5e-5 -> 1.25e-5 -> 6.25e-6
  warmup_epochs: 0             # warmup_epochs 1 cu khong co tac dung (ep1 da = lr day du)
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 64
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: False
  final_test_list: []          # bao EPOCH CUOI: test last.pth.tar bang main/test_student_3dpw_sets.py
