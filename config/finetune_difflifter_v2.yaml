# =====================================================================
# FuseKin -- DiffLifter v2 (huong che khuat)
# So voi finetune_difflifter_adaln.yaml, thay doi:
#   1. DATASET.lift_soft_conf: kenh conf = score Halpe lien tuc (truoc: mask 0/1 -> mo hinh khong biet khop nao bi che)
#   2. DIFFLIFT.occ_aug_prob : che khuat giong that khi train (2D sai cho + score thap, khong chi xoa khop)
#   3. DIFFLIFT.ema_decay    : EMA trong so (eval + luu bang EMA)
#   4. balance_datasets False + 30 epoch: ban cu lap 3DPW-train ~14 lan/epoch -> overfit tu epoch ~8
#   5. DIFFLIFT.conf_attn    : attention theo do tin cay (khop bi che it anh huong khop khac)
# Giu adaLN + scale 3 (diag da xac nhan dung).
# Chay:
#   python main/finetune_difflifter.py --cfg config/finetune_difflifter_v2.yaml --gpu 0
# =====================================================================

DATASET:
  lift_only: True
  train_list: ['Human36M', 'MuCo', '3dpw-train']
  test_list: ['3dpw', 'Human36M']
  pw3d_2d_source: 'halpe26'
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True
  workers: 8
  no_rot_aug: False

DIFFLIFT:
  # Model
  embed_dim: 512
  depth: 4
  num_heads: 8
  cond_mode: 'adaln'
  conf_attn: True          # attention bo qua bot khop score thap (moi)

  # Diffusion
  timesteps: 1000
  sampling_timesteps: 5
  num_proposals: 5
  scale: 3.0
  aggregate: 'mean'

  # Training
  val_set: '3dpw-val'
  save_dir: 'experiment/finetune_difflifter_v2'
  epochs: 30
  lr: 0.0003
  lr_decay: 0.95
  weight_decay: 0.01
  batch_size: 512
  save_freq: 5
  iters_per_epoch: 0
  print_freq: 50
  balance_datasets: False
  resume: ''
  ema_decay: 0.999

  # Occlusion augmentation
  joint_drop_prob: 0.05
  limb_drop_prob: 0.05
  jitter_std: 0.02
  occ_aug_prob: 0.15
  occ_shift_std: 0.15
