# Student "from scratch" (khong Teacher, khong KD) - GIONG HET train_student_scratch.yml,
# chi khac: TAT loss tham so shape (beta GT cua 3DPW thuoc SMPL nam, model dung SMPL neutral -> dich sai).
# So voi train_student_scratch.yml (91.8-94.8 mm).
# LUU Y: motionbert_pretrained phai la duong dan ban MotionBERT moi (khong tru root 2D) dang dung tren server.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  student_use_kd: False
  shape_param_loss_w: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
