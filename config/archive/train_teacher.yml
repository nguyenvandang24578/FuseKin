DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  # PHAI khop voi cach finetune MotionBERT: ban moi KHONG tru root o 2D -> False.
  # (Neu dung lai ban cu finetune co tru root thi doi thanh True.)
  motionbert_2d_rootrel: False

  # Backbone ResNet-50 lay tu SPIN (truoc day backbone la NGAU NHIEN -> nhanh anh vo dung).
  # Tu bat chuan hoa anh kieu ImageNet. Backbone van dong bang.
  backbone_pretrained: 'spin'

  # ---- Ep Teacher phai dung anh (xem content_ablation_test.py de kiem chung sau khi train) ----
  # (A) Luc train: input = (1-a)*GT + a*MotionBERT_lift, a ~ U(0, teacher_lift_alpha_max) rieng tung mau.
  #     0.0 = tat, Teacher nhan GT sach nhu truoc.
  #     Lan truoc 0.5 -> nhieu train trung binh chi ~9 mm (MotionBERT doan tap train tot hon val nhieu)
  #     -> Teacher khong hoc dung anh khi joint nhieu. 2.0: a > 1 khuech dai sai so MotionBERT
  #     (GT + a*(lift - GT)), nhieu train ~0-70 mm, trung binh ~35 mm, phu duoc dieu kien cua Student.
  teacher_lift_alpha_max: 2.0
  # (A) Luc eval: a CO DINH (khong random) de cac lan chay so sanh duoc voi nhau.
  #     Co y dat RIENG voi teacher_lift_alpha_max de doi alpha_max giua cac thi nghiem
  #     khong lam doi "thuoc do" luc eval.
  #     1.0 = dung dau vao cua Student (joint MotionBERT thuan) -> chon best checkpoint theo dieu kien KD can.
  #     (Lan truoc la 0.5; MPJPE val in moi epoch se KHONG so truc tiep duoc voi lan truoc.)
  teacher_lift_alpha_eval: 1.0

  # (B) Che/nhieu mot phan khop GT luc train (TAT o lan nay, dung (A) truoc cho sach).
  #     Chi bat (prob > 0) neu (A) chua du, tranh cong don 2 co che cung luc.
  teacher_joint_corrupt_prob: 0.0
  teacher_joint_corrupt_mode: 'zero'          # 'zero' | 'noise'
  teacher_joint_corrupt_noise_std: 0.15
  teacher_joint_corrupt_warmup_epochs: 0

  # (C) Head tham do: doan joint 3D CHI tu token anh dau vao fusion (truoc khi thay joint).
  #     Bo tro/chan doan, khong thay the (A)/(B) — xem log 'probe_mpjpe_mm' moi epoch.
  img_probe: True
  img_probe_w: 0.1

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 15, 25]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
