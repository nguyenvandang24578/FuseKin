# =====================================================================
# train_img_lifter_v2_3dpw_clean.yaml (2026-11-24, nguoi dung duyet) -- Fine-tune ImgLifter v2 CHI TREN 3dpw-train-clean:
#   = train_img_lifter_v2_no3dpw.yaml, chi doi:
#     1) DATASET.train_list: ['3dpw-train'] voi:
#          - pw3d_train_exclude_eval_seqs: True (loai sach sequence trung 3dpw, 3dpw-oc, 3dpw-pc, 3dpw-crowd -> 0% leak)
#          - pw3d_train_include_val_clean: True (gop sequence sach cua train + val -> 13 sequences, 12645 mau)
#     2) IMGLIFT.init_ckpt: 'experiment/img_lifter_v2_no3dpw/checkpoint/last.pth.tar'
#     3) Fine-tune nhanh: mix_mode 'full' (duyet het 12645 mau/epoch ~ 198 iter/ep), 10 epoch, lr 5e-5, lr_step [5, 8],
#        ema_decay 0.995 (phu hop ~200 iter/ep).
# Kiem tra 0% trung lap truoc khi train:
#   python tools/check_3dpw_clean_overlap.py
# Chay train & eval:
#   python main/train_img_lifter.py --cfg config/train_img_lifter_v2_3dpw_clean.yaml --exp_name img_lifter_v2_3dpw_clean --gpu 0
#   python main/eval_img_lifter.py --cfg config/train_img_lifter_v2_3dpw_clean.yaml --ckpt experiment/img_lifter_v2_3dpw_clean/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --gpu 0
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['3dpw-train']
  pw3d_train_exclude_eval_seqs: True   # loai sach moi sequence trung voi 3dpw / 3dpw-oc / 3dpw-pc / 3dpw-crowd
  pw3d_train_include_val_clean: True   # gop them cac sequence sach tu 3DPW_latest_validation.json (tong 13 seqs, 12645 mau)
  workers: 8
  pw3d_2d_source: 'openpose'           # 3dpw-train va test (3DPW / OC / PC): OpenPose; Crowd: Higher-HRNet
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True
  fusekin_unified: True
  drop_raw_smpl_stats: True

TRAIN:
  print_freq: 20
  batch_size: 64
  shuffle: True
  mix_mode: 'full'                     # duyet dung 1 luot 12645 mau (khong hoan lai) moi epoch (~198 iter/ep)
  dataset_ratio: [1.0]
  samples_per_epoch: 12645
  end_epoch: 10
  lr: 0.00005                          # lr = 5e-5 (nho de khong quen kien thuc 4 bo goc)
  lr_step: [5, 8]
  lr_factor: 0.2

TEST:
  batch_size: 64
  shuffle: False

REFINE2D:
  deconv_ch: 256                       # phai khop Refiner (256 + 1024 F16 = 1280 kenh feat_j)

IMGLIFT:
  refiner_ckpt: 'experiment/refiner2d_dense48_scratch/checkpoint/last.pth.tar'
  init_ckpt: 'experiment/img_lifter_v2_no3dpw/checkpoint/last.pth.tar'
  vit_glob_img: True                   # vector anh toan cuc TB(f8) -> c_j
  use_f16_feat: True                   # lay mau F16 (1024 kenh) tai xy Refiner noi vao feat_j (1280 kenh)
  num_ctx: 48                          # 48 diem day cua Refiner -> token ngu canh
  markov_layer: True                   # truyen tin theo xuong giua 17 khop, moi block
  markov_gate_b: True                  # cong theo do bat dinh b cua Refiner
  w_bone: 0.5                          # L1 do dai 16 xuong (met)
  w_angle: 0.1                         # (cos goc 2 xuong noi tiep: du doan - GT)^2
  embed_dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 2.0
  drop_path: 0.1
  timesteps: 1000
  scale: 3.0
  train_xy_noise: 0.0                  # tat nhieu Gauss chong len xy sau Refiner
  input_drop_prob: 0.0                 # tat xoa khop chong len PoseFix 1.0
  weight_decay: 0.01
  ema_decay: 0.995                     # phu hop voi ~198 iter / epoch
  eval_sets: ['3dpw', '3dpw-pc', '3dpw-crowd']
  eval_max_samples: 3000
  eval_K: 5
  eval_S: 2
  eta: 1.0
  jpma_max_b: 3.0
