# Teacher 100% GT 3D - GIONG HET train_teacher_gt.yml (van GIU loss shape), chi khac: train LAU HON.
# Muc dich: kiem tra Teacher co "hoc chua du" khong. train_teacher_gt.yml (30 epoch): train 38.2 / val 46.6 mm.
# Neu run nay dua train ve ~30 mm -> phan "chua thuoc bai" chu yeu do train ngan.
# Neu train van ~38 mm -> do kha nang bieu dien (VPoser / head) -> can doi dau ra.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'

  teacher_lift_alpha_max: 0.0
  teacher_lift_alpha_eval: 0.0
  teacher_lift_clean_prob: 0.0
  teacher_joint_corrupt_prob: 0.0

  img_probe: True
  img_probe_w: 0.1

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 60
  scheduler: 'step'
  lr: 0.0001
  lr_step: [15, 35, 50]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
