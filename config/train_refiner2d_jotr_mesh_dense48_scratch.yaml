# =====================================================================
# train_refiner2d_jotr_mesh_dense48_scratch (2026-11-04, nguoi dung yeu cau): Refiner DAY (17 khop + 48 dinh mesh,
# config/dense48_fps.json) TRAIN TU DAU (backbone SPIN pretrain), KHONG khoi tao tu refiner2d_jotr_mesh.
# Lich giong train_refiner2d_jotr_mesh.yaml (20 epoch, lr 1e-3, giam x0.1 o 15, 18) -> so cong bang voi ban 17 khop.
# Backbone ResNet-50 DUOC train (lr x bb_lr_scale 0.1, BN giu thong ke pretrain); heat_fuse / deconv / head lr day du.
# Chay:
#   python main/train_refiner2d.py --cfg config/train_refiner2d_jotr_mesh_dense48_scratch.yaml --exp_name refiner2d_dense48_scratch --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train
  workers: 8
  pw3d_2d_source: 'openpose'     # danh gia: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan, giong lifter jotr
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  fusekin_unified: True    # mau train thong nhat 4 bo (lib/utils/fusekin_sample.py)
  return_clean_2d: True    # them targets['joint_img_clean'] = GT 2D truoc PoseFix (khong dung voi target mesh)
  dense2d_vertex_file: 'config/dense48_fps.json'   # 48 dinh mesh co dinh -> targets dense_img, meta dense_trunc

TRAIN:
  print_freq: 20
  batch_size: 64
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 64000                   # 1000 iter / epoch voi batch 64
  end_epoch: 20
  lr: 0.001                    # head (deconv / heat_fuse / unc); backbone x REFINE2D.bb_lr_scale
  lr_step: [15, 18]
  lr_factor: 0.1

TEST:
  batch_size: 64
  shuffle: False

REFINE2D:
  backbone_pretrained: 'spin'
  target: 'mesh'
  num_dense: 48
  init_ckpt: ''             # train tu dau
  bb_lr_scale: 0.1
  bb_bn_eval: True
  heat_sigma: 2.0
  deconv_ch: 256
  w_coord: 1.0
  w_heat: 0.1
  w_nll: 0.1
  input_drop_prob: 0.1
  weight_decay: 0.0001
  eval_sets: ['3dpw', '3dpw-pc', '3dpw-crowd']
  eval_max_samples: 3000
  far_ratio: 0.2
