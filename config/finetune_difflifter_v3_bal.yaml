# =====================================================================
# FuseKin -- DiffLifter v3_bal = v3 + balance_datasets True (CHI doi 1 thu de tach nguyen nhan)
# Ly do: v3 (balance False, 3DPW-train ~4% du lieu) -> 3dpw test tot nhat o epoch 3 (77.7) roi xau dan (80.8),
#   trong khi ban adaLN cu (balance True, 3DPW-train ~1/3) dat ~74 tren 3dpw test.
# Du lieu / train (giong v2):
#   - lift_soft_conf : kenh conf = score Halpe lien tuc
#   - occ_aug_prob   : che khuat giong that (2D sai cho + score thap)
#   - ema_decay      : EMA trong so
#   - balance True + 20 epoch (khac v3: v3 dung balance False + 30 epoch)
# Kien truc (moi):
#   - conf_attn  : khop score thap it duoc tham khao trong attention
#   - skel_attn  : bias attention theo so canh tren khung xuong
#   - mask_token : vector rieng cho khop khong co 2D
#   - self_cond  : buoc DDIM sau nhin du doan buoc truoc
#   - 8 block x 384 (truoc 4 x 512), so tham so tuong duong
# Danh gia: 3dpw-val (chon best) + 3dpw moi epoch; Human36M / oc / pc moi 5 epoch.
# Chay:
#   python main/finetune_difflifter.py --cfg config/finetune_difflifter_v3_bal.yaml --gpu 0
# =====================================================================

DATASET:
  lift_only: True
  train_list: ['Human36M', 'MuCo', '3dpw-train']
  test_list: ['3dpw', 'Human36M', '3dpw-oc', '3dpw-pc']
  pw3d_2d_source: 'halpe26'
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True
  workers: 8
  no_rot_aug: False

DIFFLIFT:
  # Model
  embed_dim: 384
  depth: 8
  num_heads: 8
  cond_mode: 'adaln'
  conf_attn: True
  skel_attn: True
  mask_token: True
  self_cond: True

  # Diffusion
  timesteps: 1000
  sampling_timesteps: 5
  num_proposals: 5
  scale: 3.0
  aggregate: 'mean'

  # Training
  val_set: '3dpw-val'
  save_dir: 'experiment/finetune_difflifter_v3_bal'
  epochs: 20
  lr: 0.0003
  lr_decay: 0.95
  weight_decay: 0.01
  batch_size: 512
  save_freq: 5
  iters_per_epoch: 0
  print_freq: 50
  balance_datasets: True
  resume: ''
  ema_decay: 0.999

  # Danh gia them trong luc train (chi log)
  epoch_eval_sets: ['3dpw']
  full_eval_sets: ['Human36M', '3dpw-oc', '3dpw-pc']
  full_eval_freq: 5

  # Occlusion augmentation
  joint_drop_prob: 0.05
  limb_drop_prob: 0.05
  jitter_std: 0.02
  occ_aug_prob: 0.15
  occ_shift_std: 0.15
