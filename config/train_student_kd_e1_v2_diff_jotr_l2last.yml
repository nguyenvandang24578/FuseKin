# === train_student_kd_e1_v2_diff_jotr_l2last: GIONG HET train_student_kd_e1_v2_diff_jotr.yml, CHI DOI lifter ===
#   difflift_checkpoint -> lifter L2 (mask GT + D512, KHONG 3DPW) checkpoint CUOI (latest_epoch.bin = epoch 40),
#   khong phai best (ep11). Ep40: 3dpw 77.32, OC 84.43, PC 99.87, Crowd 112.04 (MPJPE17 lifter); tap train fit tot hon.
#   ARTS._build_diff_lifter doc embed_dim/depth/heads tu difflift_cfg trong checkpoint -> khong can sua code.
#   Du lieu Student KHONG bat halpe_gt_mask_thr (giu dung 1 yeu to thay doi = lifter).
# Chay: python main/train.py --cfg ./config/train_student_kd_e1_v2_diff_jotr_l2last.yml --exp_name student_kd_e1_v2_diff_jotr_l2last --gpu 0
#
# === train_student_kd_e1_v2_diff_jotr: GIONG HET train_student_kd_e1_v2_diff.yml, CHI DOI DU LIEU sang giao thuc JOTR ===
#   Train: Human36M + MuCo + MSCOCO + CrowdPose (KHONG 3DPW nao), 25% moi bo, 32000 mau / epoch.
#   Mau thong nhat (DATASET.fusekin_unified) giong Teacher JOTR; chon best + test tren 3dpw (test).
#   LUU Y: DiffLifter r25_cam train tren CHINH 4 bo nay -> tren anh train lifter tot hon tren 3DPW test.
#   Kiem tra du lieu: python main/check_fusekin_data.py --cfg ./config/train_student_kd_e1_v2_diff_jotr.yml
# Chay: python main/train.py --cfg ./config/train_student_kd_e1_v2_diff_jotr.yml --exp_name student_kd_e1_v2_diff_jotr --gpu 0
# E1 tren KIEN TRUC V2: KD CHI o feature (kd_mode 'feat'), khong KD output, khong adaptive. Hard loss trong so 1.0.
# Port tu config/archive/train_student_kd_e1.yml. Khac ban cu: kien truc v2, 2D Halpe-26, chon best tren 3dpw-val.
# Teacher = Teacher GT v2 (train_teacher_k16_v2.yml, --exp_name teacher_gt_v2) -> train XONG Teacher truoc.
# Teacher GT v2 va Student PHAI cung co kien truc v2 (joint_pe2d ... shape_attn_mode) vi Student khoi tao tu Teacher.
# Mo so sanh: Student scratch v2 (train_student_v2.yml) cung 2D Halpe, cung MotionBERT, cung lich train.
# Chay: python main/train.py --cfg ./config/train_student_kd_e1_v2.yml --exp_name student_kd_e1_v2 --gpu 0
#
# === BAN DIFFLIFTER: GIONG HET train_student_kd_e1_v2.yml, CHI DOI lifter MotionBERT -> DiffLifter (dong bang) ===
#   Lifter = r25_cam (khong thay 3DPW nao) + cam_bbox, S=1 K=1. Teacher GT v2 khong dung lifter -> giu nguyen.
#   DATASET.lift_soft_conf: True giong luc train lifter (PE 2D cua fusion van dung mask 0/1).
#   Kiem tra truoc: python main/check_student_v2.py --cfg ./config/train_student_kd_e1_v2_diff.yml --gpu 0
# Chay: python main/train.py --cfg ./config/train_student_kd_e1_v2_diff.yml --exp_name student_kd_e1_v2_diff --gpu 0
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw']        # moi epoch CHI danh gia val; test 1 lan cuoi tu dong (TEST.final_test_list)
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1
  # 2D 3DPW = Halpe-26 (RTMPose), PHAI giong Teacher / T-hint v2 (mac dinh config.py la 'openpose')
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  fusekin_unified: True   # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  # ---- Lifter = DiffLifter (thay MotionBERT) ----
  pose_lifter: 'diffusion'
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam_gtmask_d512_e40/latest_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_gt_v2_jotr/checkpoint/best.pth.tar'   # Teacher train tren 4 bo (train_teacher_k16_v2_jotr.yml)
  student_use_kd: True
  init_student_from_teacher: True

  # ---- Kien truc v2 (PHAI giong train_teacher_k16_v2.yml) ----
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

  # ---- KD feature (E1) ----
  kd_mode: 'feat'
  kd_feat_dist: 'mse'     # MSE(Linear(LN(student)), LN(teacher)) qua projector
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0          # bo diem noi bo ma hoa joint
  kd_w_joint: 1.0         # token khop sau fusion
  kd_w_global: 1.0        # feature toan cuc sau fusion
  kd_noise_weight: False
  kd_nce_w: 0.0
  s2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [15, 22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
