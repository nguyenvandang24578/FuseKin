# =====================================================================
# train_teacher_v3_jotr_pf05 (2026-11-02, nguoi dung xac nhan): GIONG HET train_teacher_v3_jotr.yml (GT 3D + che khop 30% +
# img_probe + co v3_*, lich 22 epoch, 0.25 moi bo), CHI DOI du lieu 2D cho KHOP Student pf05lift3dpw:
#   train 4 bo: 2D = GT + PoseFix kieu JOTR (posefix_scale 0.5, jotr_strict, update_bbox, mask nhi phan, posefix_fast)
#   test: OpenPose (3DPW). Teacher dung 2D o heatmap [A] + PE 2D trong fusion -> phai cung phan bo 2D voi Student.
# Chay: python main/train.py --cfg ./config/train_teacher_v3_jotr_pf05.yml --exp_name teacher_v3_jotr_pf05 --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw']
  workers: 16
  pw3d_2d_source: 'openpose'     # test: OpenPose (3DPW)
  halpe26_conf_thr: 0.3
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 0.5       # giong Student pf05lift3dpw
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  lift_soft_conf: False    # mask nhi phan
  fusekin_unified: True

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  backbone_pretrained: 'spin'

  # ---- Che khop GT de ep Teacher dung anh ----
  teacher_joint_corrupt_prob: 0.3
  teacher_joint_corrupt_warmup_epochs: 5

  # ---- Head tham do anh ----
  img_probe: True
  img_probe_w: 0.1

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 3       # [D] 0 = tat
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.0   # chi Student_Trainer dung; Teacher khong nhieu 2D
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000
  begin_epoch: 1
  end_epoch: 22
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 16, 20]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']
