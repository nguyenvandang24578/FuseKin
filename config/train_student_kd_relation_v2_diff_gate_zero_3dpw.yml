# DOI CHUNG KD joint tren 3DPW: sao chep ban KD E1 gate_zero, chi thay MSE joint bang quan he token.
# Quan he = cosine(LN(token)) tung cap khop SAU fusion, mask GT, bo duong cheo, Teacher detach.
# Global KD MSE/projector, hard/privileged, gate_zero, Teacher init va lich train giu nguyen.
# Hai key moi: kd_joint_relation bat loss moi; log_grad chi do gradient batch dau moi epoch.
# Khong tu can bang loss/gradient; kd_lambda=1, kd_w_joint=1 nhu E1. Xem log J/G/hard truoc khi ket luan.
# PHAI dung dung trong so lifter/Teacher cua run gate_zero doi chung, khong chi cung ten duong dan.
# Chon best 3DPW test: giao thuc phat trien, khong phai danh gia cuoi doc lap.
# Chay: python main/train.py --cfg config/train_student_kd_relation_v2_diff_gate_zero_3dpw.yml --exp_name student_kd_relation_v2_diff_gate_zero_3dpw_s123 --seed 123 --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  workers: 8
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam/best_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  difflift_spread_steps: 5
  difflift_spread_k: 20
  # Thay cong token bang gate rieng tung khop o moi block fusion.
  difflift_spread_gate: True
  difflift_spread_gate_zero: True
  difflift_spread_gate_hidden: 64
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_gt_v2/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # KD feature E1 hien co; chua them trong so uu tien ca kho.
  kd_feat_dist: 'mse'
  kd_joint_relation: True
  kd_joint_relation_log_grad: True
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 10, 15,22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']
