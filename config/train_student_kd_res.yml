# E1 + NHIEU 2D LUC TRAIN + DISTILL PHAN DU (v1). So voi E1 (87.43) va train_student_kd_noise.yml.
# Distill phan du v1: bo ma hoa joint cua Student (TRUOC fusion, chi thay joint nhieu) bi ep xap xi dac trung
# SAU fusion cua Teacher; phan con thieu (do nhieu lam mat) phai do fusion (nhin anh) bu vao.
# Log moi epoch: 'Residual (joint-only -> Teacher)' (R) > 'KD fused (J)' -> fusion/anh dang bu phan con thieu.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  TEACHER: './experiment/exp_10-10_18_35/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # ---- KD feature (giong E1) ----
  kd_mode: 'feat'
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0
  kd_noise_weight: False
  kd_nce_w: 0.0

  # ---- Distill phan du (v1) ----
  kd_res_w: 1.0

  # ---- Nhieu 2D luc train (giong train_student_kd_noise.yml) ----
  s2d_noise_prob: 0.5
  s2d_noise_jitter: 0.02
  s2d_noise_big_prob: 0.15
  s2d_noise_big_std: 0.2
  s2d_noise_swap_prob: 0.2
  s2d_noise_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
