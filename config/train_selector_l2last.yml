# Selector chon gia thuyet DiffLifter theo nhom khop bang anh (lib/models/selector.py, main/train_selector.py).
# Giao thuc JOTR: train 4 bo (khong 3DPW), cung du lieu / 2D Halpe voi Student l2last va Teacher JOTR.
# Lifter: trong so diff_lifter.* trong checkpoint Student l2last (oracle muc 33-35: Teacher giai ma L0 74.99, L5 47.30).
# Chi Selector duoc train; backbone SPIN + DiffLifter dong bang; khong can Teacher luc train.
# Chay:     python main/train_selector.py --cfg config/train_selector_l2last.yml --exp_name selector_l2last --gpu 0
# Danh gia: python main/eval_selector.py --cfg config/train_selector_l2last.yml --ckpt experiment/selector_l2last/checkpoint/last.pth.tar \
#           --gpu 0   (Teacher lay tu MODEL.TEACHER, ghi de bang --teacher_ckpt)
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw']
  workers: 8
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512             # can de dung Teacher luc danh gia
  backbone_pretrained: 'spin'
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam_gtmask_d512_e40/latest_epoch.bin'   # kien truc lifter
  TEACHER: './experiment/teacher_gt_v2_jotr_rootfix/checkpoint/best.pth.tar'   # chi dung luc danh gia (eval_selector.py)

SELECTOR:
  lifter_from_ckpt: './experiment/student_kd_e1_v2_diff_jotr_l2last/checkpoint/best.pth.tar'   # trong so lifter dung that
  K: 20
  steps: 5
  use_flip: True
  dim: 256
  heads: 8
  enc_layers: 2
  dec_layers: 2
  dropout: 0.1
  tau: 0.02
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 20
  lr_step: [14, 18]
  lr_factor: 0.1
  val_set: '3dpw-val'
  val_max_samples: 2000

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32

TEST:
  batch_size: 32
  shuffle: False
