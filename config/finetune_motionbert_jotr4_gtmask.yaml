# ======================================================
# finetune_motionbert_jotr4_gtmask: PHEP THU "kien truc/pretrain co phai nut that cua lifter?"
# Doi chung voi DiffLifter L2 (finetune_difflifter_r25_cam_gtmask_d512_e40, best ep11: 3dpw 73.11/49.24,
# OC 80.44, PC 95.94, Crowd 99.94, H36M 55.45). Giu GIONG du lieu: 4 bo JOTR (KHONG 3DPW), Halpe-26,
# soft conf, ty le 0.25 moi bo, 512000 mau/epoch, mask khop Halpe sai bang GT 2D (0.1), chon best theo PA 3dpw-val.
# Khac (do kien truc/cong thuc MotionBERT): DSTformer F=1 khoi tao MB_release.bin (pretrain mocap lon),
# loss MotionBERT (pos + 0.5 scale), aug 2D chi joint_drop 0.1 (KHONG co occ_aug/limb_drop/jitter/xoay-rieng
# nhu DiffLifter), gt2d_prob = 0 (COCO/CrowdPose khong co GT 2D trong nhanh lifter -> khong duoc bat).
# Log: MPJPE tung bo tren thanh tien do + MPJPE/PA tren 2000 mau co dinh moi bo train cuoi moi epoch.
# Chay:
#   python main/finetune_motionbert.py --cfg config/finetune_motionbert_jotr4_gtmask.yaml --gpu 0
# ======================================================

DATASET:
    train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']
    test_list: ['3dpw', 'Human36M', '3dpw-oc', '3dpw-pc', '3dpw-crowd']
    input_joint_set: 'human36'
    target_joint_set: 'human36'
    workers: 8
    use_gt_input: False
    seqlen: 1
    stride: 1
    noise: 0
    lift_only: True
    pw3d_2d_source: 'halpe26'
    h36m_2d_source: 'halpe26'
    muco_2d_source: 'halpe26'
    halpe26_conf_thr: 0.3
    lift_soft_conf: True
    no_rot_aug: False
    halpe_gt_mask_thr: 0.1

MODEL:
    motionbert_2d_rootrel: False
    motionbert_drop_joints: []

MOTIONBERT:
    pretrained: './experiment/pretrained/full/best_epoch.bin'   # SUA theo duong dan that; --pretrained ghi de
    save_dir: 'experiment/finetune_motionbert_jotr4_gtmask'
    val_set: '3dpw-val'
    select_metric: 'pa_mpjpe'
    final_ckpt: 'best'
    iters_per_epoch: 0
    balance_datasets: False
    dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
    samples_per_epoch: 512000
    train_eval_samples: 2000
    epoch_eval_sets: ['3dpw']
    full_eval_sets: ['Human36M', '3dpw-oc', '3dpw-pc', '3dpw-crowd']
    full_eval_freq: 5
    gt2d_prob: 0.0
    joint_drop_prob: 0.1

    finetune: True
    epochs: 20
    checkpoint_frequency: 5
    batch_size: 128
    dropout: 0.0
    learning_rate: 0.0002
    weight_decay: 0.01
    lr_decay: 0.95

    # Model (DSTformer) - phai khop MB_release.bin
    maxlen: 243
    dim_feat: 512
    mlp_ratio: 2
    depth: 5
    dim_rep: 512
    num_heads: 8
    att_fuse: True
    num_joints: 17

    lambda_3d_velocity: 20.0
    lambda_scale: 0.5
    lambda_lv: 0.0
    lambda_lg: 0.0
    lambda_a: 0.0
    lambda_av: 0.0
