# =====================================================================
# train_v10_jotr_cliff.yml (2026-11-19, nguoi dung duyet) -- FuseKin v10 (CHI ANH + 2D), 1 stage: du lieu JOTR + 2 sua loi he camera + giam lr:
#   [v10_cam_bbox]  cam_bbox (dx, dy, s) kieu CLIFF -> token khop + root_pose_head + cam_head (khoi tao 0).
#   [v10_proj_grad] loss chieu 2D khong detach pose, mesh xoay view_rot(-dx, -dy) ve he camera crop truoc khi chieu.
#   lr: 1e-4 -> x0.5 sau ep8, ep14, ep17 (train 1 stage nen giam lr ngay trong stage nay).
#   Du lieu + optimizer theo JOTR (JOTR/assets/yaml/main_train.yml + JOTR/common/base.py):
#     - mix_mode 'jotr': nhom 3D (Human36M, MuCo) va nhom 2D (MSCOCO, CrowdPose) keo bang nhau 50/50,
#       trong moi nhom ti le theo kich thuoc bo, moi epoch duyet het (bo dataset_ratio / samples_per_epoch).
#     - AdamW weight_decay 1e-4 (JOTR train.sh); lr 1e-4 cho CA backbone (v3_bb_lr_scale 1.0); 18 epoch, giam lr x0.5 sau ep8, ep14, ep17.
#     - 1 GPU: batch 64 (JOTR: 256 = 64 / GPU x 4 GPU); lr giu 1e-4 nhu v10_full (khong scale theo batch).
# Chay (1 GPU):
#   python main/train.py --cfg ./config/train_v10_jotr_cliff.yml --exp_name v10_jotr_cliff --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_v10_jotr_cliff.yml --ckpt experiment/v10_jotr_cliff/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --gpu 0
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (giao thuc JOTR / DPMesh)
  test_list: ['3dpw']          # moi epoch danh gia 3dpw; 4 tap test o last.pth.tar
  pw3d_ocpc_test_only: False
  workers: 8
  pw3d_2d_source: 'openpose'   # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd); train: GT + PoseFix
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True
  fusekin_unified: True

MODEL:
  name: 'student'              # dung Student_Trainer (khong KD); model that su = V10Net qua v10_e2e
  v10_e2e: True
  v10_dim: 256
  v10_enc_layers: 3
  v10_dec_layers: 4
  v10_vol_depth: 8
  v10_joint_drop: 0.1
  v10_vposer_ckpt: 'data_final/base_data/human_model_files/smpl/VPOSER_CKPT'
  v10_j17_all_w: 1.0
  v10_cam_bbox: True           # CLIFF: cam_bbox -> token khop + root_pose_head + cam_head
  v10_proj_grad: True          # loss chieu 2D co grad vao pose + bu view_rot(-dx, -dy)
  v9_reproj_w: 1.0             # trong so giam sat vi tri lay mau 2D qua cac lop
  resnet_type: 50
  hpe_dim: 256
  backbone_pretrained: 'spin'
  student_use_kd: False
  init_student_from_teacher: False
  v7_anchor: False
  v7_no_pose_param_loss: False # BAT loss tham so pose SMPL (day VPoser + root 6D nhu JOTR)
  v7_no_privileged: True       # privileged_3d = ctx_3d -> tat de khong tinh 2 lan
  v5_ctx_loss_w: 1.0           # loss khop 3D phu tu 17 token khop
  v3_bb_finetune: True         # backbone train end-to-end
  v3_bb_lr_scale: 1.0          # JOTR: lr_backbone = lr = 1e-4
  v3_bb_heatmap: True
  v3_heatmap_sigma: 2.0
  v3_refine_gamma: 0.85        # trong so giam sat cac lop decoder truoc (refine_history)
  v3_pose2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 64               # 1 GPU (JOTR: 256 tren 4 GPU)
  shuffle: True
  mix_mode: 'jotr'             # 3D (Human36M, MuCo) : 2D (MSCOCO, CrowdPose) = 50 : 50, duyet het moi epoch
  begin_epoch: 1
  end_epoch: 18                # JOTR main_train.yml
  scheduler: 'step'
  lr: 0.0001
  lr_step: [8, 14, 17]
  lr_factor: 0.5               # 1e-4 (ep1-8) -> 5e-5 (ep9-14) -> 2.5e-5 (ep15-17) -> 1.25e-5 (ep18)
  warmup_epochs: 0
  min_lr: 0.000001
  optimizer: 'adamw'
  weight_decay: 0.0001         # JOTR train.sh (--weight_decay 1e-4 ghi de YAML)
  wandb: True

TEST:
  batch_size: 64
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: False
  final_test_list: []
