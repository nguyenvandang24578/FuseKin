# =====================================================================
# FuseKin -- DiffLifter, thi nghiem cond_mode = 'adaln'
# Giong HET finetune_difflifter_scale3.yaml (embed_dim 512, scale 3, cung data / lr / epoch),
# CHI doi cond_mode 'input' -> 'adaln' + save_dir. So sanh truc tiep voi experiment/finetune_difflifter_scale3.
# Ly do: o ban 'input', 2D chi vao lop dau -> cac buoc DDIM sau tin x_t (chua loi cua buoc truoc) ma khong
#   doi chieu lai voi 2D (diag muc F: S=5 kem hon S=1). 'adaln' dua 2D + t vao MOI block theo tung khop.
# aggregate de 'mean' de chon best cung tieu chi voi ban scale3; diag in ca mean lan JPMA.
# Chay:
#   python main/finetune_difflifter.py --cfg config/finetune_difflifter_adaln.yaml --gpu 0
# =====================================================================

DATASET:
  lift_only: True
  train_list: ['Human36M', 'MuCo', '3dpw-train']
  test_list: ['3dpw', 'Human36M']
  pw3d_2d_source: 'halpe26'
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  workers: 8
  no_rot_aug: False

DIFFLIFT:
  # Model
  embed_dim: 512
  depth: 4
  num_heads: 8
  cond_mode: 'adaln'        # <-- THAY DOI duy nhat ve kien truc so voi scale3

  # Diffusion
  timesteps: 1000
  sampling_timesteps: 5
  num_proposals: 5
  scale: 3.0
  aggregate: 'mean'

  # Training
  val_set: '3dpw-val'
  save_dir: 'experiment/finetune_difflifter_adaln'
  epochs: 100
  lr: 0.0003
  lr_decay: 0.99
  weight_decay: 0.01
  batch_size: 512
  save_freq: 10
  iters_per_epoch: 0
  print_freq: 50
  balance_datasets: True
  resume: ''

  # Occlusion augmentation
  joint_drop_prob: 0.1
  limb_drop_prob: 0.1
  jitter_std: 0.02
