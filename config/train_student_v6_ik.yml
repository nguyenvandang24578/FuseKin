# train_student_v6_ik (2026-11-08, nguoi dung xac nhan) = student_v5_bonequery + 3 thay doi:
#   1. v6_ik: goc SMPL tinh bang IK giai tich (HybrIK) tu J29 = M x (lift + delta17(ctx)) + delta29(query);
#      twist tu query; moi head khoi tao 0 -> luc dau = baseline "lifter + M + IK" (experiment.md muc 19)
#   2. tat v5_bone_query (thay bang IK); them loss J29 (v6_j29_loss_w)
#   3. hgcn_freeze_adj: khoa ma tran sieu canh HyperGCN (experiment.md muc 17)
# Giu nguyen [A] [B] [B'] [C] [E], ratio 0.25, 22 epoch nhu v5 -> so truc tiep. Can M: tools/fit_h36m_to_smpl29.py.
#   python main/train.py --cfg ./config/train_student_v6_ik.yml --exp_name student_v6_ik --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_student_v6_ik.yml \
#     --ckpt experiment/student_v6_ik/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode test --gpu 0

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (lifter thi co)
  test_list: ['3dpw', '3dpw-oc', '3dpw-pc', '3dpw-crowd']   # danh gia moi epoch (chi log, bao epoch cuoi)
  pw3d_ocpc_test_only: True   # lifter co 3dpw-train -> OC / PC chi seq test
  workers: 8
  pw3d_2d_source: 'openpose'     # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan, giong lifter jotr
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0       # dong bo voi Refiner day + ImgLifter (train PoseFix 1.0)
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  imglift_checkpoint: 'experiment/img_lifter_dense48_3dpw_markov/checkpoint/last.pth.tar'   # Refiner day lay tu ckpt
  imglift_K: 5
  imglift_S: 2
  student_2d_from_refiner: True   # 2D Student = 2D Refiner (17 khop, mask 1)
  v5_bone_query: False     # v6: tat (thay bang IK)
  v6_ik: True              # v6: J29 = M x (lift + delta17(ctx)) + delta29(query) -> IK HybrIK -> goc SMPL
  v6_m_path: 'data_final/h36m17_to_smpl29.npy'
  v6_delta17: True
  v6_delta29: True
  v6_twist: True
  v6_j29_loss_w: 1.0
  hgcn_freeze_adj: True    # khoa p_adj / b_adj HyperGCN (experiment.md muc 17)
  v5_ctx_loss_w: 1.0
  backbone_pretrained: 'spin'
  student_use_kd: False    # bo KD / Teacher (train scratch)
  init_student_from_teacher: False

  # ---- KD feature (E1, giong student_kd_e1_v2_diff_jotr_l2last) ----
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 0       # [D] TAT (v4 chan doan: dong gop ~0)
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose (giong v3 KD, nguoi dung chon)
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 22                # 2026-10-27: rut ngan (truoc 30)
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 16, 20]        # 2026-10-27: giam lr som hon (truoc [15, 22, 27]); LUU Y khac lich scratch v2
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: False
  final_test_list: []          # bao EPOCH CUOI: test last.pth.tar bang main/test_student_3dpw_sets.py
