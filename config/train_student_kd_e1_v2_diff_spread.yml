# Spread + KD feature E1: tu train_student_kd_e1_v2_diff.yml, chi bat them spread.
# Pose chinh S=1/K=1; std xyz tu S=5/K=20 -> Linear khoi tao 0 -> token joint.
# KD MSE joint/global sau fusion, trong so dong deu tren cac khop GT hop le.
# Giu khoi tao smpl_model tu Teacher nhu E1; KHONG nap checkpoint Student spread cu.
# Teacher GT v2 nhan GT 3D, khong dung DiffLifter hay spread; dong bang khi KD.
# Train 3dpw-train, chon best tren 3dpw TEST: giao thuc phat trien, khong phai danh gia cuoi.
# Chay: python main/train.py --cfg config/train_student_kd_e1_v2_diff_spread.yml --exp_name student_kd_e1_v2_diff_spread --seed 123 --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  pose_lifter: 'diffusion'
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam/best_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  difflift_spread: True
  difflift_spread_steps: 5
  difflift_spread_k: 20
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_gt_v2/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # Kien truc v2 giong E1 va Teacher GT v2.
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

  # KD feature E1 hien co; chua them trong so uu tien ca kho.
  kd_mode: 'feat'
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0
  kd_noise_weight: False
  kd_nce_w: 0.0
  s2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 10, 15,22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']
