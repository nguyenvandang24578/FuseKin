# E1 + NHIEU 2D LUC TRAIN (truoc MotionBERT). Moi thu khac GIONG HET E1.
# Ly do: MotionBERT da finetune tren 3DPW-train -> joint lift tren train gan dung (~9 mm), Student gan nhu
# khong bao gio thay joint sai luc train. Nhieu 2D (chi luc train) mo phong loi joint nhu tren test.
# So voi E1 (87.43 / 57.62 / 104.86). Xem them log 'loi joint dau vao (MotionBERT)' moi epoch: muc tieu ~40-70 mm.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  TEACHER: './experiment/exp_10-10_18_35/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # ---- KD feature (giong E1) ----
  kd_mode: 'feat'
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0
  kd_noise_weight: False
  kd_nce_w: 0.0
  kd_res_w: 0.0

  # ---- Nhieu 2D luc train (toa do [-1,1], 1.0 ~ 128 px trong crop 256) ----
  s2d_noise_prob: 0.5        # 50% mau bi lam nhieu
  s2d_noise_jitter: 0.02     # lech nho moi khop (~2.5 px)
  s2d_noise_big_prob: 0.15   # moi khop 15% bi lech lon
  s2d_noise_big_std: 0.2     # lech lon (~25 px)
  s2d_noise_swap_prob: 0.2   # 20% mau nhieu bi doi trai/phai 1 cap khop
  s2d_noise_drop_prob: 0.05  # 5% khop bi mat

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
