# =====================================================================
# train_img_lifter_jotr (2026-11-04, nguoi dung xac nhan): ImgLifter = diffusion 2D -> 3D CO ANH, thay DiffLifter cu.
#   - dau vao: Refiner 2D DONG BANG (refiner2d_jotr_mesh, epoch cuoi): xy dinh nghia mesh + do bat dinh b + dac trung anh
#   - train 4 bo (KHONG 3DPW, giao thuc JOTR); 2D vao Refiner = GT + PoseFix 1.0 nhu luc train Refiner
#   - muc tieu 3D = H36M-17 tinh tu mesh (orig_joint_cam cua mau fusekin_unified), cung dinh nghia GT 3DPW
#   - danh gia: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd); K=10, S=4, gop mean / jpma; bao theo EPOCH CUOI
# Moc: DiffLifter cu jotr_pf05_3dpw (CO 3DPW-train) 3DPW 77.47 / Crowd 69.69 MPJPE17 (toan tap).
# Chay:
#   python main/train_img_lifter.py --cfg config/train_img_lifter_jotr.yaml --exp_name img_lifter_jotr --gpu 0
#   python main/eval_img_lifter.py --cfg config/train_img_lifter_jotr.yaml \
#     --ckpt experiment/img_lifter_jotr/checkpoint/last.pth.tar \
#     --old_lifter_ckpt experiment/finetune_difflifter_d512_e15_jotr_pf05_3dpw/best_epoch.bin \
#     --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml (va luc train Refiner)
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train
  workers: 8
  pw3d_2d_source: 'openpose'     # danh gia: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0       # cung phan bo dau vao voi luc train Refiner
  posefix_fast: True
  fusekin_unified: True    # mau train thong nhat 4 bo: anh + 2D + GT 3D tu mesh

TRAIN:
  print_freq: 20
  batch_size: 64
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 64000                   # 1000 iter / epoch voi batch 64
  end_epoch: 25
  lr: 0.0002
  lr_step: [18, 23]
  lr_factor: 0.1

TEST:
  batch_size: 64
  shuffle: False

REFINE2D:
  deconv_ch: 256           # phai khop Refiner (so kenh feat_j)

IMGLIFT:
  refiner_ckpt: 'experiment/refiner2d_jotr_mesh/checkpoint/last.pth.tar'
  embed_dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 2.0
  drop_path: 0.1
  timesteps: 1000
  scale: 3.0
  train_xy_noise: 0.5
  input_drop_prob: 0.1
  weight_decay: 0.01
  ema_decay: 0.999
  eval_sets: ['3dpw', '3dpw-pc', '3dpw-crowd']
  eval_max_samples: 3000
  eval_K: 5
  eval_S: 2
  eta: 1.0
  jpma_max_b: 3.0
