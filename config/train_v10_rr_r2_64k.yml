# =====================================================================
# train_v10_rr_r2_64k.yml (2026-11-22, nguoi dung duyet) -- RR-FuseKin R2 (day du) tren nen v10_cliff_lift_64k:
#   = R1 (train_v10_rr_r1_64k.yml) + bat them:
#     3) v10_rr_hgcn: True     -- Module 2B: dua R_i = (r3D, r2D) vao conf_gate san co cua AdaptiveHyperGCNLayer.
#     4) v10_ctx_to_smpl: True -- Module 3: noi j3d_rel (17x3) va 16 vector huong xuong cua ctx vao root_pose_head & vposer_head.
# Chay (1 GPU):
#   python main/train.py --cfg ./config/train_v10_rr_r2_64k.yml --exp_name v10_rr_r2_64k --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_v10_rr_r2_64k.yml --ckpt experiment/v10_rr_r2_64k/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_v10_rr_r2_64k.yml --ckpt experiment/v10_rr_r2_64k/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode all --drop3d --gpu 0
# =====================================================================

update_bbox: True
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (giao thuc JOTR / DPMesh)
  test_list: ['3dpw']          # moi epoch danh gia 3dpw; 4 tap test o last.pth.tar
  pw3d_ocpc_test_only: False
  workers: 8
  pw3d_2d_source: 'openpose'   # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd); train: GT + PoseFix
  halpe26_conf_thr: 0.3
  lift_soft_conf: False
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True
  fusekin_unified: True

MODEL:
  name: 'student'              # dung Student_Trainer (khong KD); model that su = V10Net qua v10_e2e
  v10_e2e: True
  v10_dim: 256
  v10_enc_layers: 3
  v10_dec_layers: 4
  v10_vol_depth: 8
  v10_joint_drop: 0.1
  v10_vposer_ckpt: 'data_final/base_data/human_model_files/smpl/VPOSER_CKPT'
  v10_j17_all_w: 1.0
  v10_cam_bbox: True           # CLIFF: cam_bbox -> token khop + root_pose_head + cam_head
  v10_proj_grad: True          # loss chieu 2D co grad vao pose + bu view_rot(-dx, -dy)
  v10_lifter: True             # ket hop Refiner2D + ImgLifter v2 dong bang
  v10_hyp_mem: False
  v10_drop3d_sample: 0.2
  v10_drop3d_joint: 0.1
  v10_no_lift_r: True          # [R1] bo lift_r khoi root_pose_head
  v10_rr: True                 # [R1] Module 1 (JRE + lam hong chi tren hyp) + Module 2A (cong w3D)
  v10_rr_loss_w: 0.2
  v10_rr_corrupt_prob: 0.3
  v10_rr_tau3d: 0.08
  v10_rr_tau2d: 0.08
  v10_rr_hgcn: True            # [R2] Module 2B: dua R_i vao conf_gate cua AdaptiveHyperGCNLayer
  v10_ctx_to_smpl: True        # [R2] Module 3: noi j3d_rel + 16 vector huong xuong cua ctx sang SMPL
  imglift_checkpoint: 'experiment/img_lifter_v2_no3dpw/checkpoint/last.pth.tar'
  imglift_K: 5
  imglift_S: 2
  v9_reproj_w: 1.0             # trong so giam sat vi tri lay mau 2D qua cac lop
  resnet_type: 50
  hpe_dim: 256
  backbone_pretrained: 'spin'
  student_use_kd: False
  init_student_from_teacher: False
  v7_anchor: False
  v7_no_pose_param_loss: False # BAT loss tham so pose SMPL (day VPoser + root 6D nhu JOTR)
  v7_no_privileged: True       # privileged_3d = ctx_3d -> tat de khong tinh 2 lan
  v5_ctx_loss_w: 1.0           # loss khop 3D phu tu 17 token khop
  v3_bb_finetune: True         # backbone train end-to-end
  v3_bb_lr_scale: 1.0          # lr_backbone = lr = 1e-4
  v3_bb_heatmap: True
  v3_heatmap_sigma: 2.0
  v3_refine_gamma: 0.85        # trong so giam sat cac lop decoder truoc (refine_history)
  v3_pose2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 64               # 1 GPU
  shuffle: True
  mix_mode: 'ratio'
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 64000     # 1000 iter / epoch
  begin_epoch: 1
  end_epoch: 20
  scheduler: 'step'
  lr: 0.0001
  lr_step: [8, 12, 15, 18]
  lr_factor: 0.5
  warmup_epochs: 0
  min_lr: 0.000001
  optimizer: 'adamw'
  weight_decay: 0.0001
  wandb: True

TEST:
  batch_size: 64
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: False
  final_test_list: []
