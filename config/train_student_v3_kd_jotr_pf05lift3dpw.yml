# =====================================================================
# train_student_v3_kd_jotr_pf05lift3dpw (2026-11-02, nguoi dung xac nhan, THU NGHIEM): GIONG train_student_v3_kd_jotr.yml
# (v3 KD, Teacher teacher_v3_jotr dung lai), CHI DOI du lieu 2D sang KIEU JOTR + lifter moi:
#   - lifter: finetune_difflifter_d512_e15_jotr_pf05_3dpw/best_epoch.bin (lifter DA THAY 3DPW train -> ca he thong KHONG con
#     giao thuc JOTR; OC / PC danh gia TOAN BO theo yeu cau nguoi dung -> co ro ri qua lifter)
#   - train 4 bo (KHONG 3dpw-train): 2D = GT + PoseFix kieu JOTR (posefix_scale 0.5 nhu lifter, jotr_strict), mask nhi phan, update_bbox
#   - test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
#   - ti le tron giu nhu v3 KD: 0.25 moi bo
# Chay: python main/train.py --cfg ./config/train_student_v3_kd_jotr_pf05lift3dpw.yml --exp_name student_v3_kd_jotr_pf05lift3dpw --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (lifter thi co)
  test_list: ['3dpw', '3dpw-oc', '3dpw-pc', '3dpw-crowd']   # danh gia moi epoch (lau hon scratch)
  workers: 8
  pw3d_2d_source: 'openpose'     # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan, giong lifter jotr
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 0.5       # dong bo voi lifter jotr_pf05_3dpw (nguoi dung chon 2026-11-02)
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_d512_e15_jotr_pf05_3dpw/best_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_v3_jotr/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # ---- KD feature (E1, giong student_kd_e1_v2_diff_jotr_l2last) ----
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 3       # [D] 0 = tat
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose (giong v3 KD, nguoi dung chon)
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 22                # 2026-10-27: rut ngan (truoc 30)
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 16, 20]        # 2026-10-27: giam lr som hon (truoc [15, 22, 27]); LUU Y khac lich scratch v2
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: True      # them best_<tap>.pth.tar cho tung tap trong test_list
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
