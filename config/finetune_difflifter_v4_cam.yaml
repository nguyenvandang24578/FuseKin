# =====================================================================
# FuseKin -- DiffLifter v4_cam = v3_mix + thong tin bbox so voi camera (CLIFF). CHI doi 1 thu.
# Ly do (inspect_difflifter tren v3_mix, 3dpw):
#   MPJPE 76.1 | chi chinh kich thuoc 72.6 (-3.5) | chi chinh xoay 52.4 (-23.8) | PA 47.4
#   loi truc z (do sau) 61 mm vs x, y ~26 mm; seq cau thang / ngoi te nhat
#   => loi chinh = HUONG XOAY tong the: 2D chuan hoa theo crop mat vi tri nguoi so voi camera
#      -> khong biet camera chuc len / xuong (3DPW test: camera cam tay).
# Them cam_bbox = [(cx-px)/f, (cy-py)/f, kich thuoc bbox/f] vao dieu kien moi khop.
# Chay:
#   python main/finetune_difflifter.py --cfg config/finetune_difflifter_v4_cam.yaml --gpu 0
# =====================================================================

DATASET:
  lift_only: True
  train_list: ['Human36M', 'MuCo', '3dpw-train']
  test_list: ['3dpw', 'Human36M', '3dpw-oc', '3dpw-pc']
  pw3d_2d_source: 'halpe26'
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True
  lift_cam_bbox: True
  workers: 8
  no_rot_aug: False

DIFFLIFT:
  # Model
  embed_dim: 384
  depth: 8
  num_heads: 8
  cond_mode: 'adaln'
  conf_attn: True
  skel_attn: True
  mask_token: True
  self_cond: True
  cam_cond: True
  drop_rate: 0.1
  drop_path_rate: 0.1

  # Diffusion
  timesteps: 1000
  sampling_timesteps: 5
  num_proposals: 5
  scale: 3.0
  aggregate: 'mean'

  # Training
  val_set: '3dpw-val'
  save_dir: 'experiment/finetune_difflifter_v4_cam'
  epochs: 15
  lr: 0.0003
  lr_decay: 0.95
  weight_decay: 0.01
  batch_size: 512
  save_freq: 5
  iters_per_epoch: 0
  print_freq: 50
  balance_datasets: False
  dataset_ratio: [0.4, 0.4, 0.2]   # Human36M, MuCo, 3dpw-train
  samples_per_epoch: 0             # 0 = tong so mau (~535k)
  resume: ''
  ema_decay: 0.999

  # Danh gia them trong luc train (chi log)
  epoch_eval_sets: ['3dpw']
  full_eval_sets: ['Human36M', '3dpw-oc', '3dpw-pc']
  full_eval_freq: 5

  # Occlusion augmentation
  joint_drop_prob: 0.05
  limb_drop_prob: 0.05
  jitter_std: 0.02
  occ_aug_prob: 0.15
  occ_shift_std: 0.15
