# Teacher GT TREN KIEN TRUC V2 (teacher_hint: False, GT 3D thuan):
#   anh + GT 3D (khong goi y, khong MotionBERT lift) + che khop ngau nhien (joint_corrupt 30%)
#   + 5 thay doi kien truc v2 (PE2D, self-attn khop, goc xoay theo khop, neo xuong, shape doc token).
#   + head tham do anh (img_probe) de chan doan Teacher co dung anh khong.
# Train TU DAU, 50 epoch.
# Chay:          python main/train.py --cfg ./config/train_teacher_k16_v2.yml --exp_name teacher_gt_corrupt_v2 --gpu 0
#
# === BAN GIAO THUC JOTR: GIONG HET train_teacher_k16_v2.yml, CHI DOI DU LIEU ===
#   Train: Human36M + MuCo + MSCOCO + CrowdPose (KHONG 3DPW nao), tron 25% moi bo, 32000 mau / epoch (1000 iter).
#   Mau thong nhat (DATASET.fusekin_unified, lib/utils/fusekin_sample.py): 2D Halpe-26 (soft conf), GT 3D / mesh tu
#   SMPL NeuralAnnot; MSCOCO / CrowdPose xoay sang camera uoc luong (giong DiffLifter r25_cam).
#   Moi epoch danh gia + chon best tren 3dpw TEST (giong cac ban Student hien tai, so bi lac quan);
#   train xong tu nap best va test lai tren 3dpw.
#   Kiem tra du lieu: python main/check_fusekin_data.py --cfg ./config/train_teacher_k16_v2_jotr.yml
# Chay:          python main/train.py --cfg ./config/train_teacher_k16_v2_jotr.yml --exp_name teacher_gt_v2_jotr --gpu 0
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']
  test_list: ['3dpw']        # danh gia + chon best moi epoch TREN 3dpw TEST (chu y: so bi lac quan)
  workers: 16
  # 2D 3DPW = Halpe-26 (RTMPose), du 17 khop. Can 3DPW_{train,validation,test}_halpe26.json trong thu muc PW3D.
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3          # PHAI giong luc train DiffLifter
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  lift_soft_conf: True           # conf lien tuc (giong DiffLifter r25_cam; PE 2D cua fusion van dung mask 0/1)
  fusekin_unified: True          # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  backbone_pretrained: 'spin'

  # ---- Che khop GT de ep Teacher dung anh ----
  teacher_joint_corrupt_prob: 0.3        # 30% moi khop bi che ve (0,0,0)
  teacher_joint_corrupt_warmup_epochs: 5 # tang dan tu epoch 1->5

  # ---- Head tham do anh: chan doan Teacher co dung anh khong (log probe_mpjpe_mm) ----
  img_probe: True
  img_probe_w: 0.1

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 50
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 15, 25]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
