# =====================================================================
# train_refiner2d_jotr (2026-11-03, nguoi dung xac nhan): Refiner 2D = anh crop + 2D detector -> 2D da sua cua DUNG
# nguoi + do bat dinh tung khop (lib/models/refiner2d.py). Train doc lap, khong lifter / Teacher / Student.
#   - train 4 bo (KHONG 3DPW): 2D dau vao = GT + PoseFix kieu JOTR (posefix_scale 1.0 nhu JOTR: Refiner co anh nen
#     hoc tu nhieu nang; lifter dung 0.5 vi khong co anh), jotr_strict, update_bbox, mask nhi phan
#   - muc tieu: GT 2D TRUOC PoseFix (DATASET.return_clean_2d), cung dinh nghia khop voi dau vao lifter
#   - danh gia: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd) nhu benchmark; bao theo EPOCH CUOI (khong chon ckpt)
# Chay:
#   python main/train_refiner2d.py --cfg config/train_refiner2d_jotr.yaml --exp_name refiner2d_jotr --gpu 0
#   python main/eval_refiner2d.py --cfg config/train_refiner2d_jotr.yaml \
#     --ckpt experiment/refiner2d_jotr/checkpoint/last.pth.tar \
#     --lifter_ckpt experiment/finetune_difflifter_d512_e15_jotr_pf05_3dpw/best_epoch.bin \
#     --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train
  workers: 8
  pw3d_2d_source: 'openpose'     # danh gia: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan, giong lifter jotr
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  fusekin_unified: True    # mau train thong nhat 4 bo (lib/utils/fusekin_sample.py)
  return_clean_2d: True    # them targets['joint_img_clean'] = GT 2D truoc PoseFix

TRAIN:
  print_freq: 20
  batch_size: 64
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 64000                   # 1000 iter / epoch voi batch 64
  end_epoch: 20
  lr: 0.001                    # head (deconv / heat_fuse / unc); backbone x REFINE2D.bb_lr_scale
  lr_step: [15, 18]
  lr_factor: 0.1

TEST:
  batch_size: 64
  shuffle: False

REFINE2D:
  backbone_pretrained: 'spin'
  bb_lr_scale: 0.1
  bb_bn_eval: True
  heat_sigma: 2.0
  deconv_ch: 256
  w_coord: 1.0
  w_heat: 0.1
  w_nll: 0.1
  input_drop_prob: 0.1
  weight_decay: 0.0001
  eval_sets: ['3dpw', '3dpw-pc', '3dpw-crowd']
  eval_max_samples: 3000
  far_ratio: 0.2
