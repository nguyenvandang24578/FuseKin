# E2: E1 + trong so KD theo do nhieu cua tung khop dau vao
# So sanh voi Student scratch (train_student_scratch.yml): ~92 mm. KD cu (legacy, Teacher A): ~98 mm.
# Teacher = Teacher GT 100% (train_teacher_gt.yml, 46.6 mm val) -> SUA duong dan TEACHER ben duoi.
# motionbert_pretrained: dung DUNG duong dan MotionBERT ban moi (khong tru root 2D) nhu tren server.
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # ---- KD feature ----
  kd_mode: 'feat'
  kd_feat_dist: 'mse'     # MSE(Linear(LN(student)), LN(teacher)) qua projector, khong bao hoa nhu cosine
  kd_hard_w: 1.0          # hard loss giu NGUYEN trong so (cu: 0.5)
  kd_lambda: 1.0
  kd_w_proj: 0.0          # bo diem noi bo ma hoa joint
  kd_w_joint: 1.0         # token khop sau fusion
  kd_w_global: 1.0        # feature toan cuc sau fusion
  # E2: trong so tung khop = clamp(loi_khop / loi_TB_batch, 0.2, 3.0), loi = |MotionBERT - GT|:
  #     khop sai nhieu hon trung binh -> KD manh hon. tau = 0 -> chuan hoa TUONG DOI theo batch
  #     (MotionBERT tren 3DPW-train chi sai ~9 mm nen nguong tuyet doi 50 mm se dua moi khop ve 0.2).
  kd_noise_weight: True
  kd_noise_tau: 0.0
  kd_noise_wmin: 0.2
  kd_noise_wmax: 3.0
  kd_nce_w: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
