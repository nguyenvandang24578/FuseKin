# Baseline Student scratch (kien truc CU) nhung chon checkpoint tren 3dpw-val -> moc so sanh cong bang cho train_student_v2.yml.
# Giong het train_student_scratch.yml, chi doi test_list + TEST.select_dataset.
# Chay: python main/train.py --cfg ./config/train_student_scratch_val.yml --exp_name student_scratch_val --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw-val', '3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  student_use_kd: False

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 50
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [25, 35, 45]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw-val'
