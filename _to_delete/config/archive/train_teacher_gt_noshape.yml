DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'teacher'
  resnet_type: 50
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'

  # ---- Teacher 100% GT 3D, GIONG HET train_teacher_gt.yml, chi khac: TAT loss tham so shape ----
  # Ly do: beta GT cua 3DPW thuoc SMPL theo gioi tinh, model dung SMPL neutral -> loss beta day sai
  # kich thuoc co the. Teacher GT (46.6 mm val) co xuong ngan he thong tren val:
  # ong chan -21, dui -13, cang tay -10 mm (train gan dung). Shape van hoc qua loss joint + mesh.
  # So sanh voi train_teacher_gt.yml: MPJPE val, va bang do dai xuong cua eval_teacher_train_subset.py.
  shape_param_loss_w: 0.0

  teacher_lift_alpha_max: 0.0
  teacher_lift_alpha_eval: 0.0
  teacher_lift_clean_prob: 0.0
  teacher_joint_corrupt_prob: 0.0

  img_probe: True
  img_probe_w: 0.1

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 15, 25]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
