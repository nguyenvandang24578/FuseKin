# Student S-hint (PLAN_TEACHER_HINT.md) - S-hint-init (DOI CHUNG)
# Chi khoi tao tu T-hint, KHONG KD (kd_hint_w = kd_hint_feat_w = 0). z_hat chi hoc qua hard loss.
# Teacher = T-hint (train_teacher_hint_k16.yml). Student cung kien truc, khoi tao TOAN BO tu T-hint (tru bo nen goi y),
# tu doan goi y z_hat (fusion 2 luot). So sanh: train_student_kd_e3_30ep.yml va train_student_hint_init.yml (doi chung).
# Chay: python main/train.py --cfg ./config/train_student_hint_init.yml --exp_name student_hint_init --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  motionbert_pretrained: './experiment/finetune_motionbert/best_epoch.bin'   # PHAI giong T-hint
  motionbert_2d_rootrel: False
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_hint_k16/checkpoint/best.pth.tar'           # checkpoint T-hint
  student_use_kd: True
  init_student_from_teacher: True

  # ---- Goi y nen ----
  teacher_hint: True          # de dung Teacher dung kien truc T-hint
  student_hint: True
  hint_dim: 16                # PHAI giong T-hint

  # ---- KD ----
  kd_mode: 'hint'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_hint_w: 0.0             # MSE(z_hat, z_Teacher)
  kd_hint_feat_w: 0.0        # MSE(LN(feat Student), LN(feat Teacher co goi y)), khong projector
  kd_nce_w: 0.0
  kd_res_w: 0.0
  s2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  curriculum_epochs: 9
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [15, 22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
