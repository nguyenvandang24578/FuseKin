# Student v3 SCRATCH KIEU JOTR (2026-10-30): giong train_student_v3_scratch_jotr.yml, DOI 2D:
#   train = GT 2D + nhieu (nhu lifter gt2dnoise), test = OpenPose (3DPW / OC / PC) / Higher-HRNet (Crowd) nhu JOTR / DPMesh.
# Lifter: finetune_difflifter_d512_e40_gt2dnoise (train truoc). 4 tap moi epoch, best tung tap.
# Chay: python main/train.py --cfg ./config/train_student_v3_scratch_jotr_gt2dnoise.yml --exp_name student_v3_scratch_jotr_gt2dnoise --gpu 0
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw', '3dpw-oc', '3dpw-pc', '3dpw-crowd']
  workers: 8
  pw3d_2d_source: 'openpose'   # test: OpenPose, Crowd: Higher-HRNet (nhu JOTR)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)
  # ---- Kieu JOTR (MOI): train = GT 2D + nhieu, test = detector nhu JOTR (OpenPose; Crowd Higher-HRNet) ----
  input_2d_gt: True
  input_2d_gt_split: 'train'
  gt2d_input_joints: ['Pelvis', 'R_Hip', 'R_Knee', 'R_Ankle', 'L_Hip', 'L_Knee', 'L_Ankle', 'Torso', 'Neck', 'Nose', 'L_Shoulder', 'L_Elbow', 'L_Wrist', 'R_Shoulder', 'R_Elbow', 'R_Wrist']   # bo Head_top (OpenPose / HHRNet khong co)
  gt2d_jitter_std: 0.03      # ~4 px crop 256
  gt2d_drop_prob: 0.05
  gt2d_lr_swap_prob: 0.02
  input_torso_mid: True      # Torso = trung diem Neck-Pelvis o ca train lan test

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_d512_e40_gt2dnoise/latest_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  backbone_pretrained: 'spin'
  student_use_kd: False    # from scratch
  init_student_from_teacher: False
  kd_hard_w: 0.5

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 3       # [D] 0 = tat
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 22                # 2026-10-27: rut ngan (truoc 30)
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 16, 20]        # 2026-10-27: giam lr som hon (truoc [15, 22, 27]); LUU Y khac lich scratch v2
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: True
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
