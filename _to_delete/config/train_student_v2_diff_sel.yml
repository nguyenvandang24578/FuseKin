# === train_student_v2_diff_sel: GIONG HET train_student_v2_diff.yml, CHI THEM chon gia thuyet DiffLifter theo tung khop bang anh ===
#   DiffLifter (dong bang) sinh K=20 gia thuyet (S=5) -> HypSelector: dac trung anh tai 2D tung khop
#   (grid_sample) + hinh dang gia thuyet -> softmax theo K -> pose chon theo khop -> Student nhu cu.
#   Oracle (main/oracle_student_diff.py): chon dung tung khop -> FuseKin 78.23 -> 71.25 (tran).
#   Log 'lift' trong luc train = loi pose DA CHON so voi GT (mm).
# Student v2 from scratch (PLAN_STUDENT_V2.md): KHONG Teacher, KHONG KD, KHONG goi y z. Bat TAT CA thay doi kien truc:
#   (1) PE vi tri 2D dung chung cho token khop + o anh   (2) self-attn giua 17 khop trong fusion
#   (3) head goc xoay theo tung khop (local, bo trung binh + VPoser)   (4) neo query pose vao xuong
#   (5) shape token doc ctx + token anh
# Moi epoch: 1 luot train + 1 luot val (3dpw-val), luu best theo val. Train xong: tu nap best.pth.tar, test 1 lan tren 3dpw. Kien truc v2 DA CHOT (2026-10-13), yml cu o config/archive/.
# Chay: python main/train.py --cfg ./config/train_student_v2.yml --exp_name student_v2 --gpu 0
#
# === BAN DIFFLIFTER: GIONG HET train_student_v2.yml, CHI DOI lifter MotionBERT -> DiffLifter (dong bang) ===
#   Lifter = r25_cam (train H36M + MuCo + MSCOCO + CrowdPose, KHONG thay 3DPW nao) + cam_bbox, S=1 K=1.
#   DATASET.lift_soft_conf: True giong luc train lifter (chi anh huong dau vao lifter; PE 2D cua fusion van dung mask 0/1).
#   Luu y so sanh: MotionBERT cua train_student_v2.yml finetune CO 3dpw-train -> lifter do "thuoc" tap train.
#   Kiem tra truoc: python main/check_student_v2.py --cfg ./config/train_student_v2_diff_sel.yml --gpu 0
# Chay: python main/train.py --cfg ./config/train_student_v2_diff_sel.yml --exp_name student_v2_diff_sel --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']        # moi epoch CHI danh gia val; test 1 lan cuoi tu dong (TEST.final_test_list)
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1
  # 2D 3DPW = Halpe-26 (RTMPose), PHAI giong T-hint v2 (mac dinh config.py la 'openpose')
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  # ---- Lifter = DiffLifter (thay MotionBERT) ----
  pose_lifter: 'diffusion'
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam/best_epoch.bin'
  difflift_steps: 5              # sinh gia thuyet: 5 buoc DDIM
  difflift_k: 20                 # 20 gia thuyet
  # ---- Chon gia thuyet theo tung khop bang anh (lib/models/hyp_selector.py) ----
  difflift_select: True
  difflift_select_dim: 256
  difflift_select_w: 1.0         # trong so loss phu MPJPE(pose da chon, GT 3D)
  backbone_pretrained: 'spin'
  student_use_kd: False

  # ---- Kien truc v2 ----
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  curriculum_epochs: 15
  scheduler: 'step'
  backbone_lr_scale: 0.1
  lr: 0.0001
  lr_step: [15, 22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
