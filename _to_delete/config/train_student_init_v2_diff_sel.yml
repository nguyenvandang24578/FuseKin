# === train_student_init_v2_diff_sel: GIONG HET train_student_init_v2_diff.yml, CHI THEM chon gia thuyet DiffLifter theo tung khop bang anh ===
#   DiffLifter (dong bang) sinh K=20 gia thuyet (S=5) -> HypSelector: dac trung anh tai 2D tung khop
#   (grid_sample) + hinh dang gia thuyet -> softmax theo K -> pose chon theo khop -> Student nhu cu.
#   Oracle (main/oracle_student_diff.py): chon dung tung khop -> FuseKin 78.23 -> 71.25 (tran).
#   Log 'lift' trong luc train = loi pose DA CHON so voi GT (mm).
# DOI CHUNG v2 cho E1: GIONG HET train_student_kd_e1_v2.yml nhung kd_lambda = 0 -> CHI KHOI TAO Student tu Teacher,
#   KHONG KD (tat ca cac loss KD khac = 0 vi nhan voi kd_lambda). Dung de tach bach: diem khac biet so voi Student
#   scratch v2 den tu KHOI TAO (+ hard loss), khong phai tu tin hieu KD.
# LUU Y: file nay duoc tao lai theo pattern cua ban v1 (archive/train_student_init_only.yml) vi khong thay yml v2
#   tuong ung tren ban Windows (co the chi ton tai tren server, tao thu cong luc chay). Kiem tra lai truoc khi dung
#   lam so chinh thuc cho bai, neu khac voi ban da chay ra 79.14mm thi sua lai cho dung.
# Teacher = Teacher GT v2 (train_teacher_k16_v2.yml, --exp_name teacher_gt_v2) -> train XONG Teacher truoc.
# Chay 2 seed de do do nhieu (AWL moi seed lech ~1mm):
#   python main/train.py --cfg ./config/train_student_init_v2.yml --exp_name student_init_v2_s123 --gpu 0 --seed 123
#   python main/train.py --cfg ./config/train_student_init_v2.yml --exp_name student_init_v2_s456 --gpu 0 --seed 456
#
# === BAN DIFFLIFTER: GIONG HET train_student_init_v2.yml, CHI DOI lifter MotionBERT -> DiffLifter (dong bang) ===
#   Lifter = r25_cam (train H36M + MuCo + MSCOCO + CrowdPose, KHONG thay 3DPW nao) + cam_bbox, S=1 K=1.
#   Khoi tao Student tu Teacher GT v2: chi chep smpl_model (fusion + head), lifter KHONG bi dung toi.
#   Teacher nhan GT 3D, khong dung lifter -> Teacher GT v2 cu dung duoc nguyen.
#   DATASET.lift_soft_conf: True giong luc train lifter (chi anh huong dau vao lifter; PE 2D van dung mask 0/1).
#   Kiem tra truoc: python main/check_student_v2.py --cfg ./config/train_student_init_v2_diff_sel.yml --gpu 0
# Chay: python main/train.py --cfg ./config/train_student_init_v2_diff_sel.yml --exp_name student_init_v2_diff_sel --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']        # moi epoch CHI danh gia val; test 1 lan cuoi tu dong (TEST.final_test_list)
  input_joint_set: 'human36'
  target_joint_set: 'human36'
  workers: 8
  use_gt_input: False
  seqlen: 1
  stride: 1
  # 2D 3DPW = Halpe-26 (RTMPose), PHAI giong Teacher / T-hint v2 (mac dinh config.py la 'openpose')
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter

MODEL:
  name: 'student'
  resnet_type: 50
  freeze_backbone: True
  hpe_dim: 512
  hpe_dep: 5
  # ---- Lifter = DiffLifter (thay MotionBERT) ----
  pose_lifter: 'diffusion'
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam/best_epoch.bin'
  difflift_steps: 5              # sinh gia thuyet: 5 buoc DDIM
  difflift_k: 20                 # 20 gia thuyet
  # ---- Chon gia thuyet theo tung khop bang anh (lib/models/hyp_selector.py) ----
  difflift_select: True
  difflift_select_dim: 256
  difflift_select_w: 1.0         # trong so loss phu MPJPE(pose da chon, GT 3D)
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_gt_v2/checkpoint/best.pth.tar'                          # checkpoint Teacher GT v2
  student_use_kd: True
  init_student_from_teacher: True

  # ---- Kien truc v2 (PHAI giong train_teacher_k16_v2.yml) ----
  joint_pe2d: True
  pe2d_num_freq: 6
  fusion_joint_self_attn: True
  pose_head_mode: 'per_joint'
  pose_query_bone: True
  shape_attn_mode: 'tokens'

  # ---- KD feature (TAT: kd_lambda = 0) ----
  kd_mode: 'feat'
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0          # giong E1
  kd_lambda: 0.0          # TAT KD (van khoi tao tu Teacher)
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0
  kd_noise_weight: False
  kd_nce_w: 0.0
  s2d_noise_prob: 0.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [15, 22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
