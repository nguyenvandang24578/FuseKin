# KD E1 + gate spread: g=2*sigmoid(MLP), khoi tao g=1, g trong (0,2).
# Dau vao gate: LN(joint), LN(cap nhat anh), log1p(std_xyz*10); std tu S5/K20, pose chinh S1/K1.
# KHONG cong embedding spread vao joint; Teacher/feature KD E1/hard loss giu nguyen.
# Doi chung cung gate nhung std=0: train_student_kd_e1_v2_diff_spread_gate_zero.yml.
# Giu lich LR hien tai [5,10,15,22,27] cua ban KD spread cu. Run moi, khoi tao smpl_model tu Teacher.
# Train 3dpw-train, chon best tren 3dpw TEST: chi la giao thuc phat trien.
# Chay: python main/train.py --cfg config/train_student_kd_e1_v2_diff_spread_gate.yml --exp_name student_kd_e1_v2_diff_spread_gate --seed 123 --gpu 0
DATASET:
  train_list: ['3dpw-train']
  test_list: ['3dpw']
  workers: 8
  pw3d_2d_source: 'halpe26'
  halpe26_conf_thr: 0.3
  lift_soft_conf: True

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam/best_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  difflift_spread_steps: 5
  difflift_spread_k: 20
  # Thay cong token bang gate rieng tung khop o moi block fusion.
  difflift_spread_gate: True
  difflift_spread_gate_zero: False
  difflift_spread_gate_hidden: 64
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_gt_v2/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # KD feature E1 hien co; chua them trong so uu tien ca kho.
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  begin_epoch: 1
  end_epoch: 30
  scheduler: 'step'
  lr: 0.0001
  lr_step: [5, 10, 15,22, 27]
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  final_test_list: ['3dpw']
