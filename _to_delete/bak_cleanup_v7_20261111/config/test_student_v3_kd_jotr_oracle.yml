# ORACLE (CHI DO MUC TRAN, dung GT 2D tap test de chon nguon 2D -> KHONG dung lam ket qua chinh).
# GIONG HET train_student_v3_kd_jotr.yml, CHI DOI: DATASET.pw3d_halpe_suffix '_oracle'
# (file tu tools/oracle_2d_select_3dpw.py). Dung de TEST checkpoint v3 KD co san, khong train.
# Student v3 KD (giao thuc JOTR): GIONG HET train_student_v3_scratch_jotr.yml (cung co v3_*, du lieu, lich),
# CHI DOI: bat KD theo cong thuc E1 cua v2 (khoi tao tu Teacher v3 + KD feature token khop & toan cuc, hard_w 1.0).
# So voi: v3 scratch 3DPW 75.53 / 48.31 / 90.22 (best ep15, chon theo 3DPW test).
# [A]: Student nhan ca backbone + heat_fuse cua Teacher (base.Student_Trainer).
# Moi epoch danh gia 4 tap (OC / PC toan bo = giao thuc JOTR); best.pth.tar chon theo 3dpw;
# them best_<tap>.pth.tar cho tung tap (TEST.save_best_per_set) giong JOTR / DPMesh phat hanh 1 checkpoint / tap.
# Can train XONG Teacher truoc: config/train_teacher_v3_jotr.yml (--exp_name teacher_v3_jotr).
# Chay: python main/train.py --cfg ./config/train_student_v3_kd_jotr.yml --exp_name student_v3_kd_jotr --gpu 0
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # giao thuc JOTR: KHONG 3DPW
  test_list: ['3dpw', '3dpw-oc', '3dpw-pc', '3dpw-crowd']   # danh gia moi epoch (lau hon scratch)
  workers: 8
  pw3d_2d_source: 'halpe26'
  pw3d_halpe_suffix: '_oracle'   # ORACLE: chon nguon 2D theo GT
  halpe26_conf_thr: 0.3
  lift_soft_conf: True     # conf lien tuc cho DiffLifter, giong luc train lifter
  h36m_2d_source: 'halpe26'
  muco_2d_source: 'halpe26'
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  difflift_checkpoint: './experiment/finetune_difflifter_r25_cam_gtmask_d512_e40/latest_epoch.bin'
  difflift_steps: 1
  difflift_k: 1
  backbone_pretrained: 'spin'
  TEACHER: './experiment/teacher_v3_jotr/checkpoint/best.pth.tar'
  student_use_kd: True
  init_student_from_teacher: True

  # ---- KD feature (E1, giong student_kd_e1_v2_diff_jotr_l2last) ----
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 3       # [D] 0 = tat
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  dataset_ratio: [0.25, 0.25, 0.25, 0.25]   # Human36M, MuCo, MSCOCO, CrowdPose
  samples_per_epoch: 32000                   # 1000 iter / epoch voi batch 32
  begin_epoch: 1
  end_epoch: 22                # 2026-10-27: rut ngan (truoc 30)
  scheduler: 'step'
  lr: 0.0001
  lr_step: [10, 16, 20]        # 2026-10-27: giam lr som hon (truoc [15, 22, 27]); LUU Y khac lich scratch v2
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: True      # them best_<tap>.pth.tar cho tung tap trong test_list
  final_test_list: ['3dpw']     # train xong: nap best.pth.tar, test 1 lan
