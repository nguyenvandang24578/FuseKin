# =====================================================================
# train_student_v5_bonequery_jotr (2026-11-07, nguoi dung xac nhan) = train_student_v5_bonequery, CHI doi cach tron
# du lieu: mix_mode 'jotr' thay ratio 0.25 (server manh). Lich epoch TAM THOI: chinh sau khi xem so iter / epoch.
# Chay:
#   python main/train.py --cfg ./config/train_student_v5_bonequery_jotr.yml --exp_name student_v5_bonequery_jotr --gpu 0
#   python -u main/test_student_3dpw_sets.py --cfg ./config/train_student_v5_bonequery_jotr.yml \
#     --ckpt experiment/student_v5_bonequery_jotr/checkpoint/last.pth.tar --sets 3dpw,3dpw-oc,3dpw-pc,3dpw-crowd --ocpc_mode test --gpu 0
# =====================================================================

update_bbox: True          # giong JOTR yml
DATASET:
  train_list: ['Human36M', 'MuCo', 'MSCOCO', 'CrowdPose']   # KHONG 3dpw-train (lifter thi co)
  test_list: ['3dpw', '3dpw-oc', '3dpw-pc', '3dpw-crowd']   # danh gia moi epoch (chi log, bao epoch cuoi)
  pw3d_ocpc_test_only: True   # lifter co 3dpw-train -> OC / PC chi seq test
  workers: 8
  pw3d_2d_source: 'openpose'     # test: OpenPose (3DPW / OC / PC), Higher-HRNet (Crowd)
  halpe26_conf_thr: 0.3
  lift_soft_conf: False    # mask nhi phan, giong lifter jotr
  h36m_2d_source: 'gt_posefix'
  muco_2d_source: 'gt_posefix'
  coco_2d_source: 'gt_posefix'
  crowdpose_2d_source: 'gt_posefix'
  jotr_strict: True
  posefix_scale: 1.0       # dong bo voi Refiner day + ImgLifter (train PoseFix 1.0)
  posefix_fast: True       # giong tung bit ban goc, nhanh ~10%
  fusekin_unified: True    # mau train thong nhat cho 4 bo (lib/utils/fusekin_sample.py)

MODEL:
  name: 'student'
  resnet_type: 50
  hpe_dim: 512
  imglift_checkpoint: 'experiment/img_lifter_dense48_3dpw_markov/checkpoint/last.pth.tar'   # Refiner day lay tu ckpt
  imglift_K: 5
  imglift_S: 2
  student_2d_from_refiner: True   # 2D Student = 2D Refiner (17 khop, mask 1)
  v5_bone_query: True      # v5: giai ma 3D tu ctx (sau HyperGCN) -> vector xuong -> query SMPL
  v5_ctx_loss_w: 1.0
  backbone_pretrained: 'spin'
  student_use_kd: False    # bo KD / Teacher (train scratch)
  init_student_from_teacher: False

  # ---- KD feature (E1, giong student_kd_e1_v2_diff_jotr_l2last) ----
  kd_feat_dist: 'mse'
  kd_hard_w: 1.0
  kd_lambda: 1.0
  kd_w_proj: 0.0
  kd_w_joint: 1.0
  kd_w_global: 1.0

  # ---- FuseKin-v3 ----
  v3_bb_finetune: True     # [A]
  v3_bb_lr_scale: 0.1
  v3_bb_heatmap: True      # [A]
  v3_heatmap_sigma: 2.0
  v3_joint_feat: True      # [B]
  v3_hop_bias: True        # [B']
  v3_depth_head: True      # [C]
  v3_depth_bins: 64
  v3_depth_range: 1.0
  v3_depth_loss_w: 0.1
  v3_refine_iters: 0       # [D] TAT (v4 chan doan: dong gop ~0)
  v3_refine_feat_dim: 32
  v3_refine_hidden: 32
  v3_refine_dropout: 0.25
  v3_refine_gamma: 0.85
  v3_joint_uncert: True    # [E]
  v3_pose2d_noise_prob: 0.3   # [E] 0 = tat
  v3_pose2d_noise_std: 0.02
  v3_pose2d_drop_prob: 0.05

TRAIN:
  print_freq: 20
  batch_size: 32
  shuffle: True
  mix_mode: 'jotr'         # 50% nhom 3D (Human36M + MuCo) / 50% nhom 2D (MSCOCO + CrowdPose), duyet het moi epoch
                           # (dataset_ratio / samples_per_epoch bi bo qua o che do nay)
  begin_epoch: 1
  end_epoch: 10                # TAM: epoch jotr dai hon nhieu; xem log '# [jotr] mau / epoch -> iter / epoch' roi chinh
  scheduler: 'step'
  lr: 0.0001
  lr_step: [6, 9]              # TAM: chinh theo so iter / epoch thuc te
  lr_factor: 0.5
  warmup_epochs: 1
  min_lr: 0.000001
  optimizer: 'adam'
  wandb: True

TEST:
  batch_size: 32
  shuffle: False
  select_dataset: '3dpw'
  save_best_per_set: False
  final_test_list: []          # bao EPOCH CUOI: test last.pth.tar bang main/test_student_3dpw_sets.py
